[project]
name = "pybiscus"
version = "0.18.0"
description = "A flexible Federated Learning framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Baptiste MORISSE", email = "baptiste.morisse@thalesgroup.com"},
    {name = "Laurent Morel", email = "laurent.morel@thalesgroup.com"},
]
dependencies = [
    "einops>=0.8.0",
    "flask-cors>=5.0.1",
    "flask>=3.1.0",
    "flwr>=1.42.0,<2",
    "lightning>=2.4.0",
    "omegaconf>=2.3.0",
    "packaging>=24.0",
    "rich>=14.0.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.4",
    "pyyaml>=6.0.2",
    "torchvision>=0.20.1",
    "trogon>=0.6.0",
    "typer>=0.15.1",
    "wandb>=0.19.10",
    "dominate>=2.9.1",
    "pillow>=11.0.0",
    "onnx>=1.18.0",
    "python-dotenv>=1.0.0",
    "tensorboard>=2.20.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "setuptools>=84.1",
    "onnxscript>=0.6.2",
    "torchmetrics[detection]>=1.9.0",
    "filelock>=4.2.1",
    "cronsim>=2.7",
    "cheroot>=11",
    "onnxruntime>=1.20",
]

# the FedMIA analyser of pybiscus-plugins-privacy-evaluation, a script run by hand: none of the
# plugins Pybiscus loads imports them
[project.optional-dependencies]
privacy-evaluation = [
    "scikit-learn>=1.7.2",
    "jsonargparse>=4.39.0",
]

[dependency-groups]
dev = [
    "pydeps>=3.0.1",
]

[project.scripts]
pybiscus        = "pybiscus.main:main"
pybiscus_agent  = "pybiscus.session.agent.pybiscus_agent:main"
session_manager = "pybiscus.session.manager.session_manager:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pybiscus"]

