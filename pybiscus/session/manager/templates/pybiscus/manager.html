<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% if bouquet %}{{ bouquet }} · Pybiscus{% else %}Pybiscus — Session Monitor{% endif %}</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel-2:#1b222b; --border:#232c37;
    --text:#e6edf3; --muted:#7d8794; --dim:#4b545f;
    --accent:#ff5d73; --fit:#ff5d73; --test:#4ecdc4; --eval:#ffb454; --loss:#8b7cf6;
    --ok:#4ecdc4; --warn:#ffb454; --down:#5a6470;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace; --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 82% -12%, #16202b 0%, transparent 60%), var(--bg);
    color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.5; letter-spacing:.2px}
  .eyebrow{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:#b7c2ce; font-weight:600}
  .panel>header .eyebrow{color:#cdd6e0}   /* en-têtes de panneaux : plus lisibles */
  .num{font-variant-numeric:tabular-nums}

  .app{height:100vh; display:grid; grid-template-rows:auto 1fr; gap:12px; padding:12px}

  /* top bar */
  .topbar{display:flex; align-items:center; gap:16px; padding:10px 14px; border:1px solid var(--border);
    border-radius:var(--r); background:linear-gradient(180deg,var(--panel-2),var(--panel))}
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:12px}
  .brand .mark{color:var(--accent); font-size:15px}
  /* the session's colour (--bouquet / --color): a band and a pill only, the page's own palette is
     tuned for the charts on the dark background */
  .topbar.marked{border-top:3px solid var(--session-color)}
  .bouquet-pill{font-size:11px; letter-spacing:.06em; padding:2px 10px; border-radius:999px; white-space:nowrap;
    color:color-mix(in srgb, var(--session-color) 65%, white); border:1px solid var(--session-color);
    background:color-mix(in srgb, var(--session-color) 14%, transparent)}
  .live{display:flex; align-items:center; gap:7px; color:var(--test); font-size:11px; letter-spacing:.16em; text-transform:uppercase}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--test);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(78,205,196,.55)}70%{box-shadow:0 0 0 7px rgba(78,205,196,0)}100%{box-shadow:0 0 0 0 rgba(78,205,196,0)}}
  .server-url{color:var(--muted); letter-spacing:.14em; text-transform:uppercase; font-size:10.5px}
  .server-url b{color:var(--text)}
  .sep{width:1px; height:22px; background:var(--border)}
  .kv{display:flex; align-items:center; gap:9px} .kv .num{font-size:15px; white-space:nowrap} .kv b{color:var(--accent)}
  .right{margin-left:auto; display:flex; align-items:center; gap:10px}
  .btn{cursor:pointer; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px;
  a.btn{text-decoration:none}
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; background:var(--panel-2)}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.danger:hover{border-color:#d9534f; color:#ff6b66}
  .btn:disabled{opacity:.4; cursor:not-allowed} .btn:disabled:hover{border-color:var(--border); color:var(--text)}

  /* grid : ligne haute (1fr), splitter (8px), feeds (hauteur ajustable) */
  /* colonnes : c1 | vsplit | c2(accuracy) | vsplit | c3(vignettes). 1fr chacune = tiers égaux
     par défaut ; les vsplit écrasent --cw1/--cw2 en px dès le premier drag */
  .grid{display:grid; column-gap:0; row-gap:12px; min-height:0;
    grid-template-columns:var(--cw1,1fr) 10px var(--cw2,1fr) 10px 1fr; grid-template-rows:1fr 8px var(--feeds-h,230px)}
  .col-left{grid-column:1; grid-row:1; display:grid; grid-template-rows:auto 1fr; gap:12px; min-height:0}
  .col-mid{grid-column:3; grid-row:1; display:grid; grid-template-rows:1.4fr 1fr; gap:12px; min-height:0}
  .col-right{grid-column:5; grid-row:1; min-height:0}
  .vsplit{grid-row:1; cursor:col-resize; background:var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center}
  .vsplit::before{content:''; height:48px; width:3px; border-radius:3px; background:var(--dim)}
  .vsplit:hover{background:#2a3644} .vsplit:hover::before{background:var(--accent)}
  .vsplit-1{grid-column:2} .vsplit-2{grid-column:4}
  .splitter{grid-column:1 / -1; grid-row:2; cursor:row-resize; border-radius:6px; background:var(--border);
    display:flex; align-items:center; justify-content:center}
  .splitter::before{content:''; width:48px; height:3px; border-radius:3px; background:var(--dim)}
  .splitter:hover{background:#2a3644} .splitter:hover::before{background:var(--accent)}
  .feeds{grid-column:1 / -1; grid-row:3; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; min-height:0}

  .panel{border:1px solid var(--border); border-radius:var(--r); background:var(--panel);
    display:flex; flex-direction:column; min-height:0; overflow:hidden}
  .panel>header{display:flex; align-items:center; gap:10px; padding:9px 13px; border-bottom:1px solid var(--border); background:var(--panel-2)}
  .panel>header .eyebrow{flex:1}
  .panel .body{padding:12px; flex:1; min-height:0; display:flex; flex-direction:column}
  .chip{font-size:10px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
  .chip.alert{color:var(--warn); border-color:var(--warn); background:rgba(255,180,84,.14); font-weight:600}
  .relay-select.missing{color:var(--warn); border-color:var(--warn)}
  /* the open list is drawn by the browser on a light background unless told otherwise, and inherits the select's colour */
  .relay-select,.transport-select{color-scheme:dark} .relay-select option,.transport-select option{background:var(--panel-2); color:var(--text)}
  .tool{cursor:pointer; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:2px 8px; font-size:10.5px; background:transparent; font-family:var(--mono)}
  .tool:hover{color:var(--text)}
  .tool.active{color:var(--text); border-color:var(--accent)}

  /* topology + geo */
  .nodes{display:flex; flex-direction:column; gap:8px; overflow-y:auto; min-height:0}
  /* hierarchical session: this session, then each lower level, indented under its parent */
  .tier{display:flex; flex-direction:column; gap:6px; padding-left:9px; border-left:2px solid var(--tier-color)}
  .tier.stale{opacity:.5}
  /* wrapped: in a narrow topology panel the relay picker and its warning were clipped off to the right */
  .tier-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .node{display:flex; align-items:center; gap:9px; padding:7px 9px; border:1px solid var(--border); border-radius:8px; background:var(--panel-2)}
  .node .st{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--down)}
  .node.up .st{background:var(--ok); box-shadow:0 0 8px rgba(78,205,196,.5)}
  .node.wait .st{background:var(--warn)} .node.down .st{background:var(--down)}
  .node .ico{font-size:15px; line-height:1; flex:0 0 auto} .node .name{flex:1}
  .node .kpi{font-size:15px; line-height:1} .node[title]{cursor:default}
  .empty{color:var(--dim); font-size:12px; padding:6px}
  .geo{flex:1; min-height:0; display:flex}
  .geomap{position:relative; flex:1; min-height:120px; border:1px solid var(--border); border-radius:8px;
    background:radial-gradient(700px 400px at 50% 40%, #12202a, #0c1116); overflow:hidden}
  #geo{position:absolute; inset:0; width:100%; height:100%} #geo g{cursor:default}
  .geolabels{position:absolute; inset:0; pointer-events:none}
  .geolabels .lbl{position:absolute; transform:translate(7px,-50%); font-size:10px; color:var(--text);
    white-space:nowrap; text-shadow:0 1px 3px #000,0 0 2px #000; pointer-events:auto; cursor:default}
  .geolabels .lbl.unplaced{visibility:hidden}
  #geo g[data-key], .geolabels .lbl[data-key]{cursor:grab}
  body.dragging-node, body.dragging-node *{cursor:grabbing !important; user-select:none}
  .cluster-tag{position:absolute; top:7px; left:8px; font-size:10px; color:#cdd6e0; letter-spacing:.04em;
    background:rgba(10,14,20,.55); border:1px solid var(--border); border-radius:999px; padding:2px 9px}

  /* charts */
  .acc-legend{display:flex; gap:14px; margin-left:auto}
  .acc-legend .it{display:flex; align-items:center; gap:6px; font-size:11.5px}
  .acc-legend .sw{width:9px;height:9px;border-radius:2px} .acc-legend .v{color:var(--text); font-weight:600}
  .chart{width:100%; flex:1; min-height:0; display:block}
  .chart[hidden], .acc-legend[hidden], .cons[hidden]{display:none}
  .cons{overflow:auto; flex:1; min-height:0}
  .cons table{border-collapse:collapse; width:100%; font-size:11px}
  .cons th{color:var(--muted); font-weight:500; text-align:left; padding:3px 5px; border-bottom:1px solid var(--border)}
  .cons td{padding:3px 5px; border-bottom:1px solid var(--border); white-space:nowrap}
  .cons .ok{color:var(--ok)} .cons .ko{color:var(--accent); font-weight:600} .cons .na{color:var(--dim)}
  .chart .grid-l{stroke:var(--border); stroke-width:1}
  .chart .round-l{stroke:#2a3644; stroke-width:1; stroke-dasharray:2 4}   /* marque verticale par round */
  .chart text.axis{fill:var(--muted); font-size:9px; letter-spacing:.1em}

  /* vignettes : matrice layers (lignes) × rounds (colonnes), min-size + scroll */
  .vignettes-wrapper{flex:1; min-height:0; overflow:auto}
  .vmatrix{display:grid; gap:4px; align-content:start; width:max-content; grid-auto-rows:auto}
  .vm-corner{font-size:9px; color:var(--muted); align-self:end; padding:2px 4px; white-space:nowrap}
  .vm-col{font-size:10px; color:#cdd6e0; text-align:center; align-self:end; font-variant-numeric:tabular-nums}
  .vm-row{font-size:10px; color:#cdd6e0; align-self:center; padding-right:6px; white-space:nowrap}
  .vm-cell{width:100%; min-width:46px; aspect-ratio:1; object-fit:cover; border-radius:5px; border:1px solid var(--border); background:var(--panel-2)}
  img.vm-cell{cursor:pointer; transition:border-color .15s, transform .15s}
  img.vm-cell:hover{border-color:var(--accent); transform:scale(1.08)}
  .empty-cell{opacity:.25}
  .preview-float{position:fixed; top:56px; right:24px; max-width:min(64vw,820px); max-height:min(74vh,660px);
    width:auto; height:auto; border-radius:10px; box-shadow:0 14px 50px #000d; pointer-events:none; opacity:0;
    transition:opacity .2s; z-index:50; border:1px solid var(--border); background:#0e1116}

  /* feeds */
  .list{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:2px; padding-right:4px}
  .row{display:flex; gap:9px; padding:3px 6px; border-radius:6px; font-size:12px}
  .row:hover{background:var(--panel-2)}
  .row .src{color:var(--accent); flex:0 0 auto}
  .row .msg{color:var(--text); white-space:pre-line}
  .metric-row{display:flex; align-items:center; gap:10px; padding:6px 6px}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px}

  /* session config modal */
  .overlay{position:fixed; inset:0; background:rgba(6,9,13,.72); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:60}
  .overlay.open{display:flex}
  .modal{width:min(900px,94vw); max-height:88vh; overflow:hidden; border:1px solid var(--border); border-radius:12px;
    background:var(--panel); box-shadow:0 20px 60px #000a; display:flex; flex-direction:column}
  .modal header{display:flex; align-items:center; padding:12px 15px; border-bottom:1px solid var(--border); background:var(--panel-2)}
  .modal header .eyebrow{flex:1}
  .modal header .cfg-clients{flex:2; font-size:11.5px; color:#9fb0c0; padding:0 12px}
  .modal .x{cursor:pointer; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:3px 10px; background:transparent; font-family:var(--mono)}
  .modal .mbody{padding:0; min-height:0; overflow:auto}
</style>
</head>
<body>

<script>const AGENT_STATE_PROTOCOL = {{ agent_state_protocol | tojson }};</script>
<script src="{{ url_for('static', filename='pybiscus/js/session_utils.js') }}"></script>
<script src="{{ url_for('static', filename='pybiscus/js/bouquet_color.js') }}"></script>

<div class="app">

  <!-- top bar -->
  <div class="topbar">
    <div class="brand"><span class="mark">✳</span> Pybiscus · Session</div>
    <span class="bouquet-pill" id="bouquet-pill" hidden></span>
    <div class="live"><span class="dot"></span> live</div>
    <div class="sep"></div>
    <div class="server-url">server <b id="server-url-display">—</b></div>
    <div class="sep"></div>
    <div class="kv"><span class="eyebrow">round</span><span class="num"><b id="round-num">0</b></span></div>
    <div class="kv" id="repeat-kv" hidden><span class="eyebrow">session</span><span class="num"><b id="repeat-num">1</b></span></div>
    <div class="right">
      <span class="eyebrow">Δ round</span><span class="num" id="dround-val">—</span>
      <svg id="droundSpark" width="76" height="22"></svg>
      <a class="btn" href="/pybiscus-session/network" target="_blank" title="the machines, ports and flows of the session">🌐 network</a>
      <button class="btn" id="token-btn" title="Copy the session token: the agents give it at registration">🔑 session token</button>
      <button class="btn" id="cfg-btn" disabled title="the session can be configured once its server agent is registered">⚙ config</button>
      <button class="btn" id="stop-round-btn" disabled title="no session is running">⏹ stop after round</button>
      <button class="btn" id="stop-repeat-btn" hidden title="no other session after the current one">🔁 stop repeating</button>
      <button class="btn danger" id="revokeBtn">Drop session</button>
    </div>
  </div>

  <div class="grid">

    <!-- LEFT : topology + geo -->
    <div class="col-left">
      <section class="panel">
        <header><span class="eyebrow">Topology</span><span class="chip" id="agents-count">0 agents</span></header>
        <div class="body"><div class="nodes" id="nodes"><div class="empty">no agents yet</div></div></div>
      </section>
      <section class="panel">
        <header><span class="eyebrow">Registration · geo</span>
          <button class="tool" id="layout-reset" title="Back to the registered positions (a double click resets one node)">⟲ layout</button></header>
        <div class="body"><div class="geo">
          <div class="geomap">
            <svg id="geo" viewBox="0 0 100 62" preserveAspectRatio="none"></svg>
            <div class="geolabels" id="geolabels"></div>
            <span class="cluster-tag" id="cluster-tag">💐 cluster</span>
          </div>
        </div></div>
      </section>
    </div>

    <div class="vsplit vsplit-1" id="vsplit1" title="glisser pour redimensionner"></div>

    <!-- MID : accuracy (hero) + loss -->
    <div class="col-mid">
      <section class="panel">
        <header><span class="eyebrow" id="main-metric-name">Accuracy</span>
          <div class="acc-legend">
            <span class="it"><span class="sw" style="background:var(--fit)"></span>Fit <span class="v num" id="acc-fit">—</span></span>
            <span class="it"><span class="sw" style="background:var(--test)"></span>Test <span class="v num" id="acc-test">—</span></span>
            <span class="it"><span class="sw" style="background:var(--eval)"></span>Eval <span class="v num" id="acc-eval">—</span></span>
          </div>
        </header>
        <div class="body"><svg class="chart" id="accChart" viewBox="0 0 600 200" preserveAspectRatio="none"></svg></div>
      </section>
      <section class="panel">
        <header><span class="eyebrow" id="mid-title">Loss · metric diff</span>
          <span id="mid-tabs" hidden><button class="tool active" data-tab="loss">loss</button> <button class="tool" data-tab="cycles" title="where each level of the hierarchical session spends its rounds">cycles</button> <button class="tool" data-tab="constraints" title="whether each lower level applies what its upper level imposes">constraints</button></span>
          <span class="acc-legend" id="loss-legend"><span class="it"><span class="sw" style="background:var(--loss)"></span><span class="v num" id="loss-val">—</span></span></span>
        </header>
        <div class="body"><svg class="chart" id="lossChart" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
          <svg class="chart" id="cyclesChart" viewBox="0 0 600 140" preserveAspectRatio="none" hidden></svg>
          <div class="cons" id="constraintsView" hidden></div></div>
      </section>
    </div>

    <div class="vsplit vsplit-2" id="vsplit2" title="glisser pour redimensionner"></div>

    <!-- RIGHT : vignettes -->
    <div class="col-right">
      <section class="panel" style="height:100%">
        <header><span class="eyebrow">Model vignettes</span><span class="chip">layers</span></header>
        <div class="body"><div class="vignettes-wrapper"><div class="vmatrix" id="vmatrix"></div></div></div>
      </section>
    </div>

    <!-- draggable splitter : ajuste la hauteur des feeds -->
    <div class="splitter" id="splitter" title="glisser pour redimensionner"></div>

    <!-- FEEDS -->
    <div class="feeds">
      <section class="panel"><header><span class="eyebrow">Agents log</span>
        <button class="tool" id="pause-agents-btn">pause</button><button class="tool" id="reset-agents-btn">clear</button></header>
        <div class="body"><div class="list" id="agents-list"></div></div></section>
      <section class="panel"><header><span class="eyebrow">Server log</span>
        <button class="tool" id="pause-logs-btn">pause</button><button class="tool" id="reset-logs-btn">clear</button></header>
        <div class="body"><div class="list" id="log-list"></div></div></section>
      <section class="panel"><header><span class="eyebrow">Metrics</span>
        <button class="tool" id="pause-metrics-btn">pause</button><button class="tool" id="reset-metrics-btn">clear</button></header>
        <div class="body"><div class="list" id="metrics-list"></div></div></section>
    </div>

  </div>
</div>

<img src="" class="preview-float">

<!-- session config modal -->
<div class="overlay" id="cfg-modal">
  <div class="modal">
    <header><span class="eyebrow">Session configuration</span><span class="cfg-clients" id="cfg-clients"></span><button class="x" id="cfg-close">esc ✕</button></header>
    <div class="mbody" id="cfg-body"></div>
  </div>
</div>

<script>
  // ============ data model (préservé) ============
  var session = new Session();

  const metricDiffs = new CircularBuffer(30);
  let noEvaluationRound = null;
  const durations   = new CircularBuffer(6);
  const fit_accuracies      = new CircularBuffer(40);
  const test_accuracies     = new CircularBuffer(40);
  const evaluate_accuracies = new CircularBuffer(40);

  let serverUrl = "";
  const setTxt = (id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  const fmt = v => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(2);

  // ============ endpoints (relatifs) ============
  const AGENTS_URL='/pybiscus-session/agents_logs', LOGS_URL='/pybiscus-session/logs', METRICS_URL='/pybiscus-session/metrics';
  // opens the server agent's session form, and is given to the agents at their registration
  const SESSION_TOKEN = {{ session_token | tojson }};
  const MANAGER_BOUQUET = {{ bouquet | tojson }};
  const SESSION_COLOR = {{ bouquet_color | tojson }} || (MANAGER_BOUQUET ? bouquetColor(MANAGER_BOUQUET) : null);
  if (SESSION_COLOR) {
    document.documentElement.style.setProperty('--session-color', SESSION_COLOR);
    document.querySelector('.topbar').classList.add('marked');
    if (MANAGER_BOUQUET) {
      const pill = document.getElementById('bouquet-pill');
      pill.textContent = '💐 ' + MANAGER_BOUQUET;
      pill.hidden = false;
    }
    // a dot of the same colour as the tab's icon: still visible when the title is cut
    const icon = document.createElement('link');
    icon.rel = 'icon';
    icon.href = 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="${SESSION_COLOR}"/></svg>`);
    document.head.appendChild(icon);
  }
  const VIGNETTES_URL = {{ url_for('static', filename='pybiscus/vignettes/' ~ manager_port) | tojson }};
  // a lower level of a hierarchical session: its upper level's link, whose session comes first
  let upperState = null;
  let sessionRunning = false;   // once launched, its relays no longer change
  let linkTransports = {}, linkTransportChoices = [];   // per lower level, as the manager gives them
  const upperConstraints = () => (upperState && upperState.session && upperState.session.running) ? upperState.session.constraints : null;
  const waitsForUpperSession = () => !!upperState && !upperConstraints();
  // the session form: the model, the data and the rounds of the upper level's session set and locked; a Flower
  // port of this manager's proposed, not locked (two sessions on one machine left at 3333 shared their clients)
  const FLOWER_PORT = {{ flower_port | tojson }};
  const sessionConfigUrl = serverUrl => {
    const url = `${serverUrl}/session/config?token=${encodeURIComponent(SESSION_TOKEN)}`;
    const {model, model_values = {}, ...plain} = upperConstraints() || {};
    // the model is a union: its tab selected, then its hyperparameters set
    const tabs = model ? {model} : {};
    // an Optional field: its value is set once its "Some" tab (' ') is selected
    Object.keys(plain).filter(key => key === 'num_rounds').forEach(key => { tabs[key] = ' '; });
    const presets = {options_set: tabs, options_lock: Object.keys(tabs),
                     values_set: {...plain, ...model_values, 'flower_server.server_port': FLOWER_PORT},
                     values_lock: [...Object.keys(plain), ...Object.keys(model_values)]};
    return url + '&presets=' + encodeURIComponent(JSON.stringify(presets));
  };

  // ============ feeds ============
  const agentsList=document.getElementById('agents-list'), logList=document.getElementById('log-list'), metricsList=document.getElementById('metrics-list');
  let displayedAgents=[], displayedLogs=[], displayedMetrics=[];
  let agentsPaused=false, logsPaused=false, metricsPaused=false;

  function bindFeed(resetId, pauseId, list, arrRef, setPaused){
    document.getElementById(resetId).onclick = ()=>{ list.innerHTML=''; arrRef.length=0; };
    document.getElementById(pauseId).onclick = (e)=>{ const p=setPaused(); e.target.textContent = p ? 'resume' : 'pause'; };
  }
  bindFeed('reset-agents-btn','pause-agents-btn', agentsList, displayedAgents, ()=> (agentsPaused=!agentsPaused));
  bindFeed('reset-logs-btn','pause-logs-btn', logList, displayedLogs, ()=> (logsPaused=!logsPaused));
  bindFeed('reset-metrics-btn','pause-metrics-btn', metricsList, displayedMetrics, ()=> (metricsPaused=!metricsPaused));

  function addEntries(container, arr, items){
    items.forEach(item=>{
      const div=document.createElement('div'); div.className='row';
      const src=document.createElement('span'); src.className='src'; src.textContent = item.source ? `[${item.source}]` : '';
      const msg=document.createElement('span'); msg.className='msg'; msg.textContent = item.message || JSON.stringify(item);
      div.appendChild(src); div.appendChild(msg); container.appendChild(div); arr.push(div);
      if(arr.length>200){ arr.shift().remove(); }
    });
    container.scrollTop = container.scrollHeight;
  }

  // ============ log parsing (préservé) ============
  function checkAgentLogs(newItems){
    newItems.forEach(item=>{
      const match = item.source && item.source.match(/.*?:(.*)$/);
      if(match){
        const agentName = match[1];

        // only the declared state (AgentState, agent_weblog.py) drives the state machine: the
        // former fallback on message text had drifted from the messages ("pybiscus run failed : …")
        if(!item.state) return;
        session.setAgentState(agentName, item.state);
        if(session.sessionState==="sessionCompleted" && Session.isFinalAgentState(item.state)) updateGraph();
      }
    });
  }

  // patterns come from pybiscus.core.gui_events (single source with the lines the server writes);
  // the charted metric is the model's main one (accuracy, f1score, loss…), not a fixed name
  const GUI_PATTERNS = {{ gui_log_patterns | tojson }};
  const RE = Object.fromEntries(Object.entries(GUI_PATTERNS).map(([k, src]) => [k, new RegExp(src)]));
  const PHASE_BUFFER = { fit: fit_accuracies, test: test_accuracies, evaluate: evaluate_accuracies };
  let mainMetricName = null;
  // stopRound: the last round run when a stop after it was asked for; sessionEnd: {done, total, reason}
  let stopRound = null, sessionEnd = null, stopPending = false, roundsCounted = false;

  function checkLogs(newItems){
    newItems.forEach(item=>{
      const mRound = item.message.match(RE.round);
      if(mRound && !roundsCounted) session.roundNumber = parseInt(mRound[1],10);
      // a schedule skips rounds that do not count: its own counter wins over Flower's numbers
      const mDone = item.message.match(RE.rounds_done);
      if(mDone){ roundsCounted = true; session.roundNumber = parseInt(mDone[1],10); return; }
      const mMetric = item.message.match(RE.round_metric);
      if(mMetric){
        mainMetricName = mMetric[3];
        PHASE_BUFFER[mMetric[1]].add(parseFloat(mMetric[4]));
        return;
      }
      const mDur = item.message.match(RE.duration);
      if(mDur){ durations.add(parseFloat(mDur[1])); return; }
      const mMd = item.message.match(RE.metric_diff);
      if(mMd){ metricDiffs.add(parseFloat(mMd[1])); return; }
      const mNe = item.message.match(RE.no_evaluation);
      if(mNe){ noEvaluationRound = parseInt(mNe[1],10); return; }
      const mSr = item.message.match(RE.stop_requested);
      if(mSr){ stopRound = parseInt(mSr[1],10); return; }
      const mEnd = item.message.match(RE.session_end);
      if(mEnd){ sessionEnd = {done: parseInt(mEnd[1],10), total: parseInt(mEnd[2],10), reason: mEnd[3] || null}; return; }
    });
  }

  // ============ fetch loops (préservés) ============
  // each page reads the feeds from its own cursor: a read no longer empties them for the others
  const cursors = {};
  function fetchFeed(url, onItems){
    return fetch(`${url}?since=${cursors[url] || 0}`).then(r=>r.json()).then(feed=>{
      cursors[url] = feed.next;
      if(feed.items.length) onItems(feed.items);
    }).catch(console.error);
  }
  function fetchAgents(){ if(agentsPaused) return;
    fetchFeed(AGENTS_URL, data=>{ addEntries(agentsList, displayedAgents, data); checkAgentLogs(data); }); }
  function fetchLogs(){ if(logsPaused) return;
    fetchFeed(LOGS_URL, data=>{ addEntries(logList, displayedLogs, data); checkLogs(data); renderCharts(); }); }
  function fetchMetrics(){ if(metricsPaused) return;
    fetchFeed(METRICS_URL, data=>{ addEntries(metricsList, displayedMetrics, data); }); }

  // ============ charts (nouveau rendu SVG à partir des buffers) ============
  function renderAccuracy(){
    const arrs={fit:fit_accuracies.all,test:test_accuracies.all,eval:evaluate_accuracies.all}, colors={fit:'#ff5d73',test:'#4ecdc4',eval:'#ffb454'};
    if(mainMetricName) setTxt('main-metric-name', mainMetricName);
    // 0 -> 1 for a rate (accuracy, f1…); otherwise (a loss…) the range of the values
    const all=[...arrs.fit,...arrs.test,...arrs.eval];
    const unit=all.every(v=>v>=0 && v<=1);
    const vmin=all.length?Math.min(...all):0, vmax=all.length?Math.max(...all):1, span=(vmax-vmin)||1;
    const W=600,H=200,padL=30,padR=8,padT=10,padB=16, lo=unit?0:Math.max(0,vmin-span*0.1), hi=unit?1:vmax+span*0.1;
    const off={fit:1, test:0, eval:1};   // fit/eval décalés d'un round (le serveur calcule fit/test avant le round 1)
    const nRef=Math.max(arrs.test.length, arrs.fit.length+1, arrs.eval.length+1);
    const x=i=>padL+(W-padL-padR)*(nRef>1? i/(nRef-1):0), y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
    let s='';
    for(let g=0;g<=5;g++){const v=lo+(hi-lo)*g/5; s+=`<line class="grid-l" x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}"/><text class="axis" x="3" y="${y(v)+3}">${v.toFixed(unit?1:2)}</text>`;}
    for(let i=0;i<nRef;i++) s+=`<line class="round-l" x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${H-padB}"/>`;   // marques de round
    ['eval','test','fit'].forEach(k=>{const arr=arrs[k]; if(arr.length<1)return; const o=off[k]; const pts=arr.map((v,i)=>`${x(i+o)},${y(v)}`).join(' ');
      s+=`<polyline points="${pts}" fill="none" stroke="${colors[k]}" stroke-width="1.5" stroke-linejoin="round"/>`;
      const i=arr.length-1; s+=`<circle cx="${x(i+o)}" cy="${y(arr[i])}" r="3" fill="${colors[k]}" stroke="#0e1116" stroke-width="1.4"/>`;});
    s+=`<text class="axis" x="${padL}" y="${H-3}">round →</text>`;
    document.getElementById('accChart').innerHTML=s;
    setTxt('acc-fit',fmt(fit_accuracies.latest)); setTxt('acc-test',fmt(test_accuracies.latest)); setTxt('acc-eval',fmt(evaluate_accuracies.latest));
  }
  function renderLoss(){
    const arr=metricDiffs.all, svg=document.getElementById('lossChart');
    setTxt('loss-val', arr.length ? Number(arr[arr.length-1]).toFixed(3) : '—');
    if(arr.length<1){
      svg.innerHTML = noEvaluationRound===null ? ''
        : `<text class="axis" x="10" y="20">no federated evaluation result (round ${noEvaluationRound}): no client evaluated the model</text>`;
      return;
    }
    const W=600,H=140,padL=30,padR=8,padT=10,padB=16;
    const mn=Math.min(...arr), mx=Math.max(...arr), span=(mx-mn)||1, lo=Math.max(0, mn-span*0.1), hi=mx+span*0.1;   // borne basse >= 0
    const n=arr.length, x=i=>padL+(W-padL-padR)*(n>1?i/(n-1):0), y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
    let s='';
    for(let g=0;g<3;g++){const v=lo+(hi-lo)*g/2; s+=`<line class="grid-l" x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}"/><text class="axis" x="3" y="${y(v)+3}">${v.toFixed(2)}</text>`;}
    for(let i=0;i<n;i++) s+=`<line class="round-l" x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${H-padB}"/>`;   // marques de round
    const pts=arr.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="#8b7cf6" stroke-width="1.5" stroke-linejoin="round"/>`;
    s+=`<circle cx="${x(n-1)}" cy="${y(arr[n-1])}" r="3" fill="#8b7cf6" stroke="#0e1116" stroke-width="1.4"/>`;
    svg.innerHTML=s;
  }
  function renderDround(){
    const arr=durations.all; setTxt('dround-val', arr.length ? arr[arr.length-1].toFixed(1)+'s' : '—');
    const el=document.getElementById('droundSpark'); if(!arr.length){ el.innerHTML=''; return; }
    const w=76,h=22,mx=Math.max(...arr)||1,bw=w/Math.max(arr.length,1);
    el.innerHTML=arr.map((v,i)=>{const bh=(h-2)*v/mx; return `<rect x="${i*bw+0.5}" y="${h-bh}" width="${Math.max(1,bw-1.5)}" height="${bh}" fill="${i===arr.length-1?'#ff5d73':'#39424e'}"/>`;}).join('');
  }
  // ============ cycles of a hierarchical session ============
  // one row per level, this session first, then each lower one indented: a bar per round, the
  // share of this session's round the level spent on it (equal rounds: a first round lengthened by
  // the agents' launch flattened all the others). A lower level's bar starts with this session's
  // round, when its relay sends the model down: only durations come up, the clocks of the sites
  // are never compared
  let midTab = 'loss', lastCycles = null;
  const MID_TITLES = {loss: 'Loss · metric diff', cycles: 'Cycles · per level', constraints: 'Constraints · per level'};
  document.querySelectorAll('#mid-tabs .tool').forEach(b => b.onclick = () => { midTab = b.dataset.tab; showMidTab(); });
  function showMidTab(){
    document.querySelectorAll('#mid-tabs .tool').forEach(b => b.classList.toggle('active', b.dataset.tab === midTab));
    document.getElementById('lossChart').toggleAttribute('hidden', midTab !== 'loss');
    document.getElementById('loss-legend').toggleAttribute('hidden', midTab !== 'loss');
    document.getElementById('cyclesChart').toggleAttribute('hidden', midTab !== 'cycles');
    document.getElementById('constraintsView').toggleAttribute('hidden', midTab !== 'constraints');
    setTxt('mid-title', MID_TITLES[midTab]);
    renderCycles(); renderConstraints();
  }
  // each lower level against its parent (this session for the first depth): the managers impose
  // the values, a ✗ says a level runs a session launched before its parent's, or by hand
  function renderConstraints(){
    const view = document.getElementById('constraintsView');
    if(midTab !== 'constraints' || !lastCycles) return;
    if(!lastCycles.groups.length){ view.innerHTML = '<p class="na">no lower level</p>'; return; }
    const same = (a, b) => JSON.stringify(a ?? null, Object.keys(a || {}).sort()) === JSON.stringify(b ?? null, Object.keys(b || {}).sort());
    const show = v => v == null ? '—' : (typeof v === 'object' ? Object.entries(v).map(([k, x]) => `${k.replace('model.config.', '')}=${x}`).join(', ') : String(v));
    const cell = (running, imposed, applied) => {
      if(!running || imposed == null) return '<td class="na">—</td>';
      return same(imposed, applied) ? `<td class="ok" title="${esc(show(applied))}">✓</td>`
                                    : `<td class="ko" title="${esc(`imposed: ${show(imposed)} · applied: ${show(applied)}`)}">✗</td>`;
    };
    // short headings: the middle column is narrow; the full names in their tooltips
    const columns = [['model', 'model', 'model'], ['hyper', 'model_values', "the model's hyperparameters"], ['data', 'data', 'data plugin'], ['rounds', 'num_rounds', 'number of rounds']];
    let html = '<table><tr><th>level</th><th>session</th>' + columns.map(([title, , tip]) => `<th title="${esc(tip)}">${title}</th>`).join('')
             + '<th title="the link_id its relay and its server share">link</th></tr>';
    lastCycles.groups.forEach(gr => {
      const own = gr.session || {}, parent = (gr.parent ? gr.parent.session : lastCycles.ownSession) || {};
      const running = !!own.running, imposed = parent.running ? (parent.constraints || {}) : null, applied = own.constraints || {};
      const state = own.dropped ? `<td class="ko" title="${esc(own.dropped)}">⚠ dropped</td>`
                  : running ? '<td class="ok">● running</td>' : '<td class="na">idle</td>';
      html += `<tr><td style="padding-left:${6 + (gr.depth - 1) * 12}px; color:${esc(gr.color)}">${gr.depth > 1 ? '↳ ' : ''}${esc(gr.bouquet)}</td>${state}`
            + columns.map(([, key]) => cell(running, imposed && imposed[key], applied[key])).join('')
            // a running level whose parent made it no link runs out of step: "none" against its link
            + cell(running, parent.running ? ((parent.links || {})[gr.bouquet] ?? 'none') : null, own.link_id) + '</tr>';
    });
    view.innerHTML = html + '</table>';
  }
  function renderCycles(){
    const svg = document.getElementById('cyclesChart');
    if(midTab !== 'cycles' || !lastCycles) return;
    const rows = [{label: MANAGER_BOUQUET || 'this session', color: SESSION_COLOR || '#7d8794', depth: 0, cycles: lastCycles.own}]
      .concat(lastCycles.groups.map(gr => ({label: gr.bouquet, color: gr.color, depth: gr.depth, cycles: gr.cycles, stale: gr.stale})));
    // this session's round: the whole round; a lower level's: its work, from the model's arrival
    const seconds = (row, c) => row.depth ? (c.work_s ?? c.round_s) : c.round_s;
    const rounds = [...new Set(rows.flatMap(r => r.cycles.map(c => c.round)))].sort((a, b) => a - b).slice(-20);
    if(!rounds.length){ svg.innerHTML = '<text class="axis" x="10" y="20">no round yet</text>'; return; }
    // a round's slot: its length in this session, else the longest any level spent on it
    const slot = Object.fromEntries(rounds.map(n => {
      const own = rows[0].cycles.find(c => c.round === n);
      return [n, (own && own.round_s) || Math.max(0.001, ...rows.map(r => { const c = r.cycles.find(c => c.round === n); return c ? (seconds(r, c) || 0) : 0; }))];
    }));
    const W=600, H=140, padL=112, padR=6, padT=6, padB=14, rowH=(H-padT-padB)/rows.length, slotW=(W-padL-padR)/rounds.length;
    let s = ''; const start = {};
    rounds.forEach((n, i) => { const x = padL + i*slotW; start[n] = x; s += `<line class="round-l" x1="${x}" y1="${padT}" x2="${x}" y2="${H-padB}"/><text class="axis" x="${x+2}" y="${H-3}">r${n}</text>`; });
    rows.forEach((row, i) => {
      const y = padT + i*rowH;
      s += `<text class="axis" x="${3+row.depth*8}" y="${y+rowH*0.62}" style="fill:${esc(row.color)}">${row.depth ? '↳ ' : ''}${esc(row.label)}</text>`;
      row.cycles.forEach(c => {
        const sec = seconds(row, c);
        if(!(c.round in start) || (sec == null && !c.failed)) return;
        const w = Math.max(1.5, (slotW - 2) * Math.min(1, (sec || 0) / slot[c.round]));
        const tip = `${row.label} · round ${c.round}: ` + (c.failed ? 'failed' :
          `${sec.toFixed(1)} s${row.depth ? ' of work' : ''}${c.examples ? `, ${c.examples} examples` : ''}`);
        // literal colours: var(--…) does not resolve in SVG attributes
        s += `<rect x="${start[c.round]}" y="${y+rowH*0.2}" width="${w}" height="${rowH*0.6}" rx="1" fill="${c.failed ? '#ff5d73' : esc(row.color)}" opacity="${row.stale ? .4 : .85}"><title>${esc(tip)}</title></rect>`;
      });
    });
    svg.innerHTML = s;
  }
  function renderCharts(){ renderAccuracy(); renderLoss(); renderDround(); renderCycles(); renderConstraints(); renderRound(); }
  function renderRound(){
    const el = document.getElementById('round-num');
    if(!sessionEnd){ el.textContent = session.roundNumber; el.title = ''; return; }
    el.textContent = `${sessionEnd.done}/${sessionEnd.total} ${sessionEnd.reason ? '⏹' : '🏁'}`;
    el.title = sessionEnd.reason ? `stopped after round ${sessionEnd.done}: ${sessionEnd.reason}` : 'all the rounds were run';
  }

  // ============ topology + geo ============
  const ROLE_ICON  = { server:'🧠', client:'💻' };
  // "declared" is the manager's own state for an agent that has not reported yet
  const STATE_ICON  = { declared:'⚪', validating:'🔍', validated:'☑️', executing:'▶️', terminated:'🏁', failed:'💥', stopped:'⏹️', 'not validated':'❌' };
  const STATE_CLASS = { declared:'wait', validating:'wait', validated:'up', executing:'up', terminated:'down', failed:'down', stopped:'down', 'not validated':'down' };
  const stateClass = st => STATE_CLASS[st] || 'wait';
  // a state added to AgentState without its display would silently show as "waiting"
  AGENT_STATE_PROTOCOL.states.filter(st => !(st in STATE_ICON && st in STATE_CLASS))
    .forEach(st => console.warn(`agent state "${st}" has no icon or class in manager.html`));
  const esc = s => String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  // ============ map layout: nodes moved with the mouse ============
  // sites a few tens of km apart overlapped their labels: each label takes the first free place
  // around its node, servers and managers first; failing that, a place over another node's dot (a
  // crowded corner hid servers' names); failing both, it is hidden (the node's tooltip keeps its
  // name) rather than drawn over another label
  function placeGeoLabels(){
    const box = document.getElementById('geolabels'), W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const area = box.getBoundingClientRect(), tag = document.getElementById('cluster-tag').getBoundingClientRect();
    const taken = [{l: tag.left-area.left, t: tag.top-area.top, r: tag.right-area.left, b: tag.bottom-area.top}], dots = [];
    const labels = [...box.querySelectorAll('.lbl')].map(el => {
      el.classList.remove('unplaced'); el.style.transform = 'none';
      return {el, x: parseFloat(el.style.left)/100*W, y: parseFloat(el.style.top)/100*H, w: el.offsetWidth, h: el.offsetHeight,
              rank: parseInt(el.dataset.rank || '3', 10)};
    });
    labels.forEach(lb => dots.push({l: lb.x-4, t: lb.y-4, r: lb.x+4, b: lb.y+4}));   // the nodes themselves
    const clear = (q, boxes) => boxes.every(o => q.r <= o.l || o.r <= q.l || q.b <= o.t || o.b <= q.t);
    const inside = q => q.l >= 0 && q.t >= 0 && q.r <= W && q.b <= H;
    labels.sort((a, b) => a.rank - b.rank).forEach(lb => {
      const {w, h} = lb, side = [[7, -h/2], [-w-7, -h/2]];
      const offsets = side.concat([[-w/2, -h-5], [-w/2, 5], [4, -h-2], [4, 2], [-w-4, -h-2], [-w-4, 2]],
        ...[1, 2].map(k => side.flatMap(([dx, dy]) => [[dx, dy-k*(h+1)], [dx, dy+k*(h+1)]])));
      const spots = offsets.map(([dx, dy]) => ({dx, dy, l: lb.x+dx, t: lb.y+dy, r: lb.x+dx+w, b: lb.y+dy+h})).filter(q => inside(q) && clear(q, taken));
      const spot = spots.find(q => clear(q, dots)) || spots[0];
      if(!spot){ lb.el.classList.add('unplaced'); return; }
      taken.push(spot); lb.el.style.transform = `translate(${spot.dx}px, ${spot.dy}px)`;
    });
  }
  // the registered coordinates stay as they are: only where this page draws a node changes, to pull
  // apart the nodes that overlap; one layout per manager page (host:port), kept by the browser
  const LAYOUT_KEY = `pybiscus-manager-layout:${location.host}`;
  let manualLayout = {};
  try { manualLayout = JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}; } catch(e) { /* registered positions */ }
  const saveLayout = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(manualLayout)); } catch(e) { /* not kept */ } };
  let lastTopology = null, draggedNode = null, redrawPending = false;
  function redrawTopology(){
    if(redrawPending || !lastTopology) return;
    redrawPending = true;
    requestAnimationFrame(()=>{ redrawPending = false; renderTopology(...lastTopology); });
  }
  function mapPoint(ev){
    const r = document.getElementById('geo').getBoundingClientRect();
    return { x: Math.min(98, Math.max(2, (ev.clientX-r.left)/r.width*100)),
             y: Math.min(60, Math.max(2, (ev.clientY-r.top)/r.height*62)) };
  }
  const geomap = document.querySelector('.geomap');
  geomap.addEventListener('pointerdown', ev=>{
    const el = ev.target.closest('[data-key]'); if(!el) return;
    draggedNode = el.dataset.key; document.body.classList.add('dragging-node'); ev.preventDefault();
  });
  // on the document: the map is redrawn under the pointer while it moves
  document.addEventListener('pointermove', ev=>{ if(!draggedNode) return; manualLayout[draggedNode] = mapPoint(ev); redrawTopology(); });
  document.addEventListener('pointerup', ()=>{
    if(!draggedNode) return;
    draggedNode = null; document.body.classList.remove('dragging-node'); saveLayout();
  });
  geomap.addEventListener('dblclick', ev=>{
    const el = ev.target.closest('[data-key]'); if(!el) return;
    delete manualLayout[el.dataset.key]; saveLayout(); redrawTopology();
  });
  // the relays designated in the topology: kept by the manager, which refuses a change once the session runs
  document.getElementById('nodes').addEventListener('change', ev=>{
    if(ev.target.classList.contains('transport-select')){
      fetch('/pybiscus-session/link-transports', {method:'POST', headers:{'Content-Type':'application/json', 'X-Pybiscus':'1'},
                                                  body: JSON.stringify({bouquet: ev.target.dataset.bouquet, transport: ev.target.value})})
        .then(r=>r.json().then(answer=>{ if(!r.ok) alert(answer.message); }))
        .finally(()=>{ ev.target.blur(); updateGraph(); });
      return;
    }
    if(!ev.target.classList.contains('relay-select')) return;
    fetch('/pybiscus-session/relays', {method:'POST', headers:{'Content-Type':'application/json', 'X-Pybiscus':'1'},
                                       body: JSON.stringify({bouquet: ev.target.dataset.bouquet, client: ev.target.value})})
      .then(r=>r.json().then(answer=>{ if(!r.ok) alert(answer.message); }))
      .finally(()=>{ ev.target.blur(); updateGraph(); });
  });
  document.getElementById('layout-reset').addEventListener('click', ()=>{ manualLayout = {}; saveLayout(); redrawTopology(); });

  // the lower levels' agents, reported by their managers (--upper-url), recursively: one group per
  // bouquet, in tree order; nodes are keyed by bouquet, two sites may reuse an agent name
  function flattenLowerLevels(levels, parent, depth, groups){
    (levels||[]).forEach(lv=>{
      const group = {bouquet:lv.bouquet, color:lv.color || bouquetColor(lv.bouquet), stale:!!lv.stale,
                     url:lv.manager_url, manager:lv.manager || {}, relays:lv.relays || {}, cycles:lv.cycles || [], session:lv.session || null, parent, depth, nodes:[]};
      (lv.agents||[]).forEach(a=>group.nodes.push({key:`${lv.bouquet}/${a.name}`, name:a.name, role:a.role,
        state:a.state || 'declared', geo:a.geo_location, bouquet:lv.bouquet, loc:a.location, org:a.organisation, group}));
      groups.push(group);
      flattenLowerLevels(lv.lower_levels, group, depth+1, groups);
    });
    return groups;
  }
  function renderTopology(servers, clients, meta, lowerLevels, upperLevel, manager, relays){
    lastTopology = [servers, clients, meta, lowerLevels, upperLevel, manager, relays];
    relays = relays || {};
    meta = meta || {};
    const nodes=[];
    Object.keys(servers).forEach(n=>nodes.push({key:n, name:n, role:'server', state:session.getAgentState(n)}));
    Object.keys(clients).forEach(n=>nodes.push({key:n, name:n, role:'client', state:session.getAgentState(n)}));
    nodes.forEach(nd=>{ const m=meta[nd.name]||{}; nd.geo=m.geo_location; nd.bouquet=m.bouquet; nd.loc=m.location; nd.org=m.organisation; });
    const groups = flattenLowerLevels(lowerLevels, null, 1, []);
    const lowerNodes = groups.flatMap(gr=>gr.nodes), allNodes = nodes.concat(lowerNodes);
    setTxt('agents-count', nodes.length+' agents' + (lowerNodes.length ? ` + ${lowerNodes.length} lower` : ''));
    const tip = nd => [nd.name, nd.relays ? 'relay → '+nd.relays : nd.role, nd.state, nd.bouquet&&('💐 '+nd.bouquet), nd.org, nd.loc,
      (typeof nd.geo==='string')?nd.geo:null,
      (nd.geo&&typeof nd.geo.latitude==='number')?`${nd.geo.latitude.toFixed(3)}, ${nd.geo.longitude.toFixed(3)}`:null].filter(Boolean).join(' · ');
    // the relays: clients of a session standing for one of its lower levels (designated by its manager)
    const relayedBy = rels => Object.fromEntries(Object.entries(rels || {}).map(([bouquet, client]) => [client, bouquet]));
    const ownRelayed = relayedBy(relays);
    groups.forEach(gr=>{ const relayed = relayedBy(gr.relays); gr.nodes.forEach(nd=>{ nd.relays = relayed[nd.name]; }); });
    nodes.forEach(nd=>{ nd.relays = ownRelayed[nd.name]; });
    const colourOf = bouquet => (groups.find(gr=>gr.bouquet===bouquet) || {}).color || '#7d8794';
    const row = nd =>
      `<div class="node ${stateClass(nd.state)}" title="${esc(tip(nd))}">`+
        `<span class="st"></span><span class="ico">${nd.relays ? '🔁' : (ROLE_ICON[nd.role]||'❔')}</span>`+
        `<span class="name">${esc(nd.name)}`+
        (nd.relays ? ` <span class="bouquet-pill" style="--session-color:${esc(colourOf(nd.relays))}" title="relays this lower level">→ ${esc(nd.relays)}</span>` : '')+
        `</span><span class="kpi">${STATE_ICON[nd.state]||'⚪'}</span></div>`;
    // how the link to a direct lower level is made, chosen with its relay before the launch
    const TRANSPORT_HINT = {directory: 'files in a directory: its relay runs on the machine of its server',
                            manager: "this manager's mailbox, over HTTP: its relay and its server on any machines"};
    const transportPicker = gr => linkTransportChoices.length ?
      `<select class="transport-select tool" data-bouquet="${esc(gr.bouquet)}"${sessionRunning ? ' disabled' : ''}`+
      ` title="${sessionRunning ? 'the session is running: its links no longer change' : 'how the link to ' + esc(gr.bouquet) + ' is made'}">`+
      linkTransportChoices.map(t=>`<option value="${esc(t)}"${t===linkTransports[gr.bouquet]?' selected':''} title="${esc(TRANSPORT_HINT[t] || t)}">link: ${esc(t)}</option>`).join('')+
      `</select>` : '';
    // a direct lower level: its relay chosen among this session's clients; deeper: shown only
    const relayPicker = gr => {
      if(gr.depth === 1){
        const chosen = relays[gr.bouquet], missing = !(chosen && chosen in clients);
        return `<select class="relay-select tool${missing ? ' missing' : ''}" data-bouquet="${esc(gr.bouquet)}"${sessionRunning ? ' disabled' : ''}`+
          ` title="${sessionRunning ? 'the session is running: its relays no longer change' : 'the client of this session that relays ' + esc(gr.bouquet)}">`+
          `<option value="">relay: —</option>`+
          nodes.filter(n=>n.role==='client').map(c=>`<option value="${esc(c.name)}"${c.name===chosen?' selected':''}>relay: ${esc(c.name)}</option>`).join('')+`</select>`+
          (missing ? '<span class="chip alert" title="a session with lower levels launches once each has a relay">⚠ no relay</span>' : '')+
          transportPicker(gr);
      }
      const relay = (gr.parent.relays || {})[gr.bouquet];
      return `<span class="chip">relay: ${esc(relay || '—')}</span>`;
    };
    // a manager's address as information only: each site is followed in its own manager's page,
    // often out of reach of the other levels' operators (loopback, administration token)
    const tierHead = (name, color, count, url, stale, extra) =>
      `<div class="tier-head"><span class="bouquet-pill" style="--session-color:${esc(color)}"${url ? ` title="manager: ${esc(url)}"` : ''}>💐 ${esc(name)}</span>`+
      `<span class="chip">${count} agent${count===1?'':'s'}</span>`+ (extra || '') +
      (stale ? '<span class="chip" title="its manager has stopped reporting">unreachable</span>' : '')+`</div>`;
    let list = nodes.map(row).join('');
    // the upper level this manager reports to (--upper-url): its bouquet, and whether it is reached
    const upper = upperLevel ? {...upperLevel, name: upperLevel.bouquet || upperLevel.url,
      // literal colours: also used in SVG attributes, where var(--…) does not resolve
      colour: upperLevel.reached === false ? '#5a6470' : (upperLevel.color || (upperLevel.bouquet ? bouquetColor(upperLevel.bouquet) : '#7d8794'))} : null;
    const upperHead = upper ? `<div class="tier-head"><span class="bouquet-pill" style="--session-color:${esc(upper.colour)}" title="manager: ${esc(upper.url)}">↑ 💐 ${esc(upper.name)}</span>`+
      `<span class="chip" title="${esc(upper.problem || '')}">${upper.reached ? 'connected' : upper.reached === false ? 'not reached' : 'connecting…'}</span>`+
      `<span class="chip" title="this session's model (with its hyperparameters), data and number of rounds follow the upper level's session">${upper.session && upper.session.running ? 'session configured' : 'session not configured'}</span>`+
      `<span class="chip" title="the client of the upper-level session that relays this one">relay: ${esc((upper.session && upper.session.relay) || '—')}</span>`+
      (upper.dropped ? `<span class="chip alert" title="${esc(upper.dropped)}">⚠ session dropped</span>` : '')+`</div>` : '';
    if(groups.length || upper){
      // the tree: this session, then each lower level indented under its parent
      list = upperHead + `<div class="tier" style="--tier-color:${esc(SESSION_COLOR || 'var(--border)')}">`+
               tierHead(MANAGER_BOUQUET || 'this session', SESSION_COLOR || 'var(--muted)', nodes.length, null, false)+list+`</div>`+
             groups.map(gr=>`<div class="tier${gr.stale?' stale':''}" style="--tier-color:${esc(gr.color)}; margin-left:${gr.depth*14}px">`+
               tierHead('↳ '+gr.bouquet, gr.color, gr.nodes.length, gr.url, gr.stale, relayPicker(gr))+gr.nodes.map(row).join('')+`</div>`).join('');
    }
    // not while a relay or a link is being chosen: the periodic redraw would close the list under the pointer
    if(!document.activeElement || !['relay-select', 'transport-select'].some(c=>document.activeElement.classList.contains(c)))
      // the link to the upper level shows before the first agent registers
      document.getElementById('nodes').innerHTML = allNodes.length ? list : upperHead + '<div class="empty">no agents yet</div>';
    // positions : par lat/lon si dispo (ajustées à la bbox des agents + décalage anti-superposition),
    // sinon disposition schématique (serveur au centre, clients en cercle, niveaux inférieurs autour)
    const geo=document.getElementById('geo');
    const W=100,H=62, cx=50, cy=31;
    const server = nodes.find(n=>n.role==='server');
    const clientNodes = nodes.filter(n=>n.role==='client');
    // the managers of a hierarchical session: supervision, not federated learning, hence a shape of
    // their own; where they say they are (--geo), else next to their session's server
    const managerNodes = [];
    const ownManager = {key:'^manager', bouquet:MANAGER_BOUQUET, loc:(manager||{}).location, geo:(manager||{}).geo_location,
                        colour:SESSION_COLOR || '#cdd6e0', serverKey:server && server.key};
    if(groups.length || upper) managerNodes.push(ownManager);
    groups.forEach(gr=>{ const lowerServer = gr.nodes.find(n=>n.role==='server');
      gr.managerNode = {key:`${gr.bouquet}/^manager`, bouquet:gr.bouquet, loc:gr.manager.location, geo:gr.manager.geo_location,
                        colour:gr.color, group:gr, serverKey:lowerServer && lowerServer.key};
      managerNodes.push(gr.managerNode); });
    const hasGeo = nd => nd.geo && typeof nd.geo.latitude==='number' && typeof nd.geo.longitude==='number';
    const placedNodes = allNodes.concat(managerNodes.filter(hasGeo));
    const geoNodes = placedNodes.filter(hasGeo);
    const pos={};
    if(geoNodes.length){
      const lats=geoNodes.map(n=>n.geo.latitude), lons=geoNodes.map(n=>n.geo.longitude);
      const minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lons),maxLo=Math.max(...lons);
      // the top band is the cluster tag's: a northernmost node drawn there was hidden under it
      const spanLa=(maxLa-minLa)||1, spanLo=(maxLo-minLo)||1, padX=10, padTop=15, padBottom=7;
      const project=(la,lo)=>({ x:padX+(W-2*padX)*((lo-minLo)/spanLo), y:padTop+(H-padTop-padBottom)*(1-(la-minLa)/spanLa) });
      // regroupe les nœuds partageant la même position projetée
      const posGroups={};
      placedNodes.forEach(nd=>{ const b = hasGeo(nd) ? project(nd.geo.latitude, nd.geo.longitude) : {x:cx,y:cy};
        const key=`${b.x.toFixed(1)},${b.y.toFixed(1)}`;
        (posGroups[key]=posGroups[key]||{b, m:[]}).m.push(nd); });
      // répartition régulière sur un cercle centré sur la position commune (rayon croissant avec le nb de nœuds)
      Object.values(posGroups).forEach(gr=>{
        if(gr.m.length===1){ pos[gr.m[0].key]=gr.b; return; }
        const R=Math.min(4 + gr.m.length*0.9, 14);
        gr.m.forEach((nd,j)=>{ const a=-Math.PI/2 + j*2*Math.PI/gr.m.length;
          pos[nd.key]={x:gr.b.x+R*Math.cos(a), y:gr.b.y+R*Math.sin(a)}; });
      });
    } else {
      const R=groups.length?18:26, Ry=groups.length?13:20; if(server) pos[server.key]={x:cx,y:cy};
      clientNodes.forEach((c,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/Math.max(clientNodes.length,1); pos[c.key]={x:cx+R*Math.cos(a), y:cy+Ry*Math.sin(a)}; });
      groups.forEach((gr,i)=>{ const a=-Math.PI/2 + (i+0.5)*2*Math.PI/groups.length, c={x:cx+38*Math.cos(a), y:cy+24*Math.sin(a)};
        gr.nodes.forEach((nd,j)=>{ const b=j*2*Math.PI/gr.nodes.length;
          pos[nd.key] = gr.nodes.length===1 ? c : {x:c.x+5*Math.cos(b), y:c.y+4*Math.sin(b)}; }); });
    }
    managerNodes.forEach(m=>{ if(pos[m.key]) return;
      const s = m.serverKey && (manualLayout[m.serverKey] || pos[m.serverKey]);
      pos[m.key] = s ? {x:s.x-6, y:s.y-5} : {x:8, y:8}; });
    // kept inside the map: the circle spreading the nodes of one place went past its edges
    const inMap = q => ({x:Math.min(98, Math.max(2, q.x)), y:Math.min(60, Math.max(2, q.y))});
    const at = nd => manualLayout[nd.key] || inMap(pos[nd.key] || {x:cx,y:cy});
    let g='';
    for(let i=1;i<10;i++) g+=`<line x1="${i*10}" y1="0" x2="${i*10}" y2="62" stroke="#18222c" stroke-width=".3"/>`;
    for(let i=1;i<6;i++)  g+=`<line x1="0" y1="${i*10}" x2="100" y2="${i*10}" stroke="#18222c" stroke-width=".3"/>`;
    // each lower level: its own star in its colour (federated learning), and a dashed link from its
    // manager to its parent's (supervision: the servers of two levels are not linked)
    groups.forEach(gr=>{
      const lowerServer = gr.nodes.find(n=>n.role==='server');
      const parentManager = gr.parent ? gr.parent.managerNode : ownManager;
      const op = gr.stale ? .25 : .55;
      if(lowerServer) gr.nodes.filter(n=>n.role==='client').forEach(c=>{ const s=at(lowerServer), p=at(c);
        g+=`<line x1="${s.x}" y1="${s.y}" x2="${p.x}" y2="${p.y}" stroke="${esc(gr.color)}" stroke-width=".35" opacity="${op}"/>`; });
      const s=at(parentManager), p=at(gr.managerNode);
      g+=`<line x1="${s.x}" y1="${s.y}" x2="${p.x}" y2="${p.y}" stroke="${esc(gr.color)}" stroke-width=".45" stroke-dasharray="1.4 .9" opacity="${op+.2}"/>`;
    });
    // the federated link between two levels: a relay (client of the upper session) and the server
    // of the lower session it stands for
    groups.forEach(gr=>{
      const pool = gr.parent ? gr.parent.nodes : nodes;
      const relay = pool.find(nd=>nd.relays===gr.bouquet), lowerServer = gr.nodes.find(n=>n.role==='server');
      if(relay && lowerServer){ const a=at(relay), b=at(lowerServer);
        g+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${esc(gr.color)}" stroke-width=".7" opacity="${gr.stale ? .3 : .85}"/>`; }
    });
    // the upper level, off the map's geography: a mark at the top, dashed to this session's manager
    if(upper){ const u = manualLayout['^upper'] || {x:50, y:4}, s = at(ownManager);
      g+=`<line x1="${u.x}" y1="${u.y}" x2="${s.x}" y2="${s.y}" stroke="${esc(upper.colour)}" stroke-width=".45" stroke-dasharray="1.4 .9" opacity="${upper.reached ? .75 : .4}"/>`;
      g+=`<g data-key="^upper"><title>${esc(upper.name + ' · ' + upper.url)}</title>`+
         `<rect x="${u.x-1.1}" y="${u.y-1.1}" width="2.2" height="2.2" rx=".4" fill="${esc(upper.colour)}"/></g>`; }
    // losange de pixels : centre + 4 pointes (N/S/E/O) + 4 milieux d'arêtes
    const diamond=[[0,0],[0,-1.3],[0,1.3],[-1.3,0],[1.3,0],[-0.65,-0.65],[0.65,-0.65],[-0.65,0.65],[0.65,0.65]];
    // this session's nodes in its bouquet's colour, as the lower levels' are in theirs; without a
    // bouquet, the former colours (server, client up or waiting)
    const localColour = nd => SESSION_COLOR ? esc(SESSION_COLOR) : (nd.role==='server'?'#ff5d73':(stateClass(nd.state)==='up'?'#4ecdc4':'#ffb454'));
    if(server) clientNodes.forEach((c,i)=>{ const s=at(server), p=at(c);
      g+= SESSION_COLOR ? `<line x1="${s.x}" y1="${s.y}" x2="${p.x}" y2="${p.y}" stroke="${esc(SESSION_COLOR)}" stroke-width=".45" opacity=".55"/>`
                        : `<line x1="${s.x}" y1="${s.y}" x2="${p.x}" y2="${p.y}" stroke="#2b3947" stroke-width=".5"/>`;
      if(c.state==='terminated' || c.state==='stopped') return;   // client terminé (🏁) ou arrêté (⏹️) : on garde le lien mais plus d'étincelles
      const cloud=diamond.map((d,k)=>`<rect x="${(d[0]-0.3).toFixed(2)}" y="${(d[1]-0.3).toFixed(2)}" width="0.6" height="0.6" fill="#ff5d73"><animate attributeName="opacity" values="0.12;1;0.12" dur="${(0.45+0.11*k).toFixed(2)}s" repeatCount="indefinite"/></rect>`).join('');
      g+=`<g><animateMotion dur="${(2.8+0.35*i).toFixed(2)}s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M ${s.x} ${s.y} L ${p.x} ${p.y}"/>${cloud}</g>`;});
    nodes.forEach(nd=>{ const p=at(nd), c=localColour(nd), r = SESSION_COLOR && nd.role!=='server' ? 1.2 : 1.6;
      g+=`<g data-key="${esc(nd.key)}"><title>${esc(tip(nd))}</title>`+
         `<circle cx="${p.x}" cy="${p.y}" r="${r*2}" fill="${c}" opacity=".16"/><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}"/></g>`;});
    // the lower levels' nodes in their bouquet's colour, a server larger than its clients
    lowerNodes.forEach(nd=>{ const p=at(nd), c=esc(nd.group.color), op=nd.group.stale ? .35 : 1, r=nd.role==='server' ? 1.4 : 1;
      g+=`<g data-key="${esc(nd.key)}" opacity="${op}"><title>${esc(tip(nd))}</title>`+
         `<circle cx="${p.x}" cy="${p.y}" r="${r*2}" fill="${c}" opacity=".16"/><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${c}"/></g>`;});
    // each manager attached to its session's server: fine dots, apart from the dashes between
    // managers (supervision) and the solid lines of the federated learning
    managerNodes.forEach(m=>{ if(!m.serverKey) return;
      const serverNode = (m.group ? m.group.nodes : nodes).find(n=>n.key===m.serverKey); if(!serverNode) return;
      const a=at(m), b=at(serverNode);
      g+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${esc(m.colour)}" stroke-width=".35" stroke-dasharray=".25 .7" stroke-linecap="round" opacity="${m.group && m.group.stale ? .3 : .8}"/>`; });
    managerNodes.forEach(m=>{ const p=at(m), c=esc(m.colour), op = m.group && m.group.stale ? .35 : 1, d=1.9;
      g+=`<g data-key="${esc(m.key)}" opacity="${op}"><title>${esc(['manager', m.bouquet && ('💐 '+m.bouquet), m.loc].filter(Boolean).join(' · '))}</title>`+
         `<polygon points="${p.x},${p.y-d} ${p.x+d},${p.y} ${p.x},${p.y+d} ${p.x-d},${p.y}" fill="${c}" stroke="#0e1116" stroke-width=".3"/></g>`; });
    geo.innerHTML=g;
    // libellés en overlay HTML (nets) + tooltip (autres infos de registration à brancher côté back)
    const upperLabel = upper ? (u => `<span class="lbl" data-rank="0" data-key="^upper" style="left:${u.x}%; top:${(u.y/62*100).toFixed(1)}%; color:${esc(upper.colour)}"`+
      ` title="${esc(upper.url)}">↑ ${esc(upper.name)}${upper.reached === false ? ' (not reached)' : ''}</span>`)(manualLayout['^upper'] || {x:50, y:4}) : '';
    const managerLabels = managerNodes.map(m=>{ const p=at(m);
      return `<span class="lbl" data-rank="1" data-key="${esc(m.key)}" style="left:${p.x}%; top:${(p.y/62*100).toFixed(1)}%; color:${esc(m.colour)}">`+
             `◆ ${esc(m.bouquet || '')} manager</span>`; }).join('');
    document.getElementById('geolabels').innerHTML = upperLabel + managerLabels + allNodes.map(nd=>{ const p=at(nd);
      const colour = nd.group ? `; color:${esc(nd.group.color)}` : (SESSION_COLOR ? `; color:${esc(SESSION_COLOR)}` : '');
      return `<span class="lbl" data-rank="${nd.role==='server' ? 0 : nd.relays ? 2 : 3}" data-key="${esc(nd.key)}" style="left:${p.x}%; top:${(p.y/62*100).toFixed(1)}%${colour}" title="${esc(tip(nd))}">${nd.relays ? '🔁' : (ROLE_ICON[nd.role]||'')} ${esc(nd.name)}</span>`;}).join('');
    placeGeoLabels();
    // tag cluster : le bouquet du manager (--bouquet), sinon ceux déclarés par les agents à leur registration
    const bouquets = MANAGER_BOUQUET ? [MANAGER_BOUQUET] : [...new Set(nodes.map(n=>n.bouquet).filter(Boolean))];
    setTxt('cluster-tag', '💐 '+(bouquets.length? bouquets.join(' · ') : 'cluster')+(nodes.length? ` · ${nodes.length} nodes`:'')
      +(groups.length ? ' · ↳ '+groups.map(gr=>gr.bouquet).join(' · ') : '')
      +(upper ? ' · ↑ '+upper.name : ''));
  }

  // ============ session update loop (préservé + rendu) ============
  function updateGraph(){
    fetch('/pybiscus-session/agents').then(r=>r.json()).then(data=>{
      const servers = data.servers || {};
      // le rendu (topology/geo/charts) ne doit jamais bloquer la logique de popup ci-dessous
      registeredClients = Object.keys(data.clients || {}).length;
      setTxt('cfg-clients', `${registeredClients} client${registeredClients === 1 ? '' : 's'} registered = default min_clients`);
      upperState = data.upper_level || null;
      sessionRunning = !!data.session_running;
      renderRepetition(data.repetition || null);
      linkTransports = data.link_transports || {}; linkTransportChoices = data.link_transport_choices || [];
      lastCycles = {own: data.cycles || [], ownSession: data.session || null, groups: flattenLowerLevels(data.lower_levels || [], null, 1, [])};
      document.getElementById('mid-tabs').hidden = !lastCycles.groups.length && !data.upper_level;
      try { renderTopology(servers, data.clients || {}, data.meta || {}, data.lower_levels || [], data.upper_level || null, data.manager || null, data.relays || {}); renderCharts(); }
      catch(e){ console.error('[manager] render error:', e); }
      if(serverUrl==="" && Object.keys(servers).length>0){
        serverUrl = Object.values(servers)[0];
        setTxt('server-url-display', serverUrl);
      }
      // the session window no longer opens on its own (it hid the topology where the relays are
      // chosen): the config button opens it, once nothing is missing
      const lowerBouquets = (data.lower_levels || []).map(level => level.bouquet);
      const withoutRelay = lowerBouquets.filter(bouquet => !((data.relays || {})[bouquet] in (data.clients || {})));
      const missing = [];
      if(serverUrl === "") missing.push('its server agent registered');
      if(withoutRelay.length) missing.push('a relay for ' + withoutRelay.join(', ') + ' (Topology)');
      if(waitsForUpperSession()) missing.push(`the upper-level session ${upperState.bouquet || upperState.url} configured`);
      const cfgBtn = document.getElementById('cfg-btn');
      cfgBtn.disabled = missing.length > 0;
      cfgBtn.title = missing.length ? 'the session can be configured once it has ' + missing.join(', and ') : 'configure and launch the session';
      renderStopButton(!!data.upper_level);
    }).catch(console.error);
  }

  // ============ session config modal ============
  let registeredClients = 0;

  function minClientsRisk(wanted, registered, partitioned){
    if(wanted < registered)
      return `Rounds will start as soon as ${wanted} of the ${registered} clients are connected: the first rounds may run without the others, `
           + `and a robust aggregation then sizes its defense on fewer clients. In exchange, ${registered - wanted} client(s) may leave without stalling the session.`;
    return `Every round will wait for ${wanted} clients, ${wanted - registered} more than registered now: the first round waits (up to 24 h) for them to connect`
         + (partitioned ? `, and clients registered after the launch get no share of the data partition.` : `.`);
  }
  function openSessionConfig(url){
    const body=document.getElementById('cfg-body');
    if(url && !body.querySelector('iframe')){
      const f=document.createElement('iframe'); f.src=url;
      f.style.cssText='width:min(900px,94vw);height:78vh;border:none;background:#0e1116;display:block';
      body.appendChild(f);
    }
    document.getElementById('cfg-modal').classList.add('open');
  }
  function closeSessionConfig(){ document.getElementById('cfg-modal').classList.remove('open'); }
  document.getElementById('cfg-close').onclick = closeSessionConfig;
  document.getElementById('token-btn').onclick = async (e)=>{
    // the clipboard API exists in secure contexts only (https, localhost): shown otherwise
    try{ await navigator.clipboard.writeText(SESSION_TOKEN); e.target.textContent='🔑 copied'; setTimeout(()=>e.target.textContent='🔑 session token', 1500); }
    catch{ prompt('Session token, to give to the agents:', SESSION_TOKEN); }
  };
  // a session launched again at each deadline: the page goes on reading between two sessions, and
  // each new one starts with its own round counter and end
  let repetitionSessions = 0;
  function renderRepetition(repetition){
    const active = !!repetition && (repetition.status === 'running' || repetition.status === 'waiting');
    session.keepPolling = active;
    document.getElementById('repeat-kv').hidden = !repetition;
    const btn = document.getElementById('stop-repeat-btn');
    btn.hidden = !active;
    btn.disabled = !!repetition?.stop_requested;
    btn.textContent = repetition?.stop_requested ? '🔁 last session' : '🔁 stop repeating';
    if(!repetition) return;
    if(repetition.sessions > repetitionSessions){
      if(repetitionSessions > 0){ sessionEnd = null; stopRound = null; stopPending = false; roundsCounted = false; session.roundNumber = 0; }
      repetitionSessions = repetition.sessions;
    }
    const next = repetition.next_deadline ? new Date(repetition.next_deadline).toLocaleString() : null;
    document.getElementById('repeat-num').textContent = repetition.status === 'waiting' ? `${repetition.sessions} ⏳` :
      repetition.status === 'failed' ? `${repetition.sessions} 💥` : repetition.status === 'ended' ? `${repetition.sessions} 🏁` : `${repetition.sessions}`;
    document.getElementById('repeat-kv').title = `launched again ${repetition.schedule}` + (next ? `; next session at ${next}` : '')
      + (repetition.reason ? `; ${repetition.reason}` : '');
  }
  document.getElementById('stop-repeat-btn').onclick = async ()=>{
    try{
      const response = await fetch('/pybiscus-session/stop-repeating', {method:'POST', headers:{'X-Pybiscus':'1'}});
      if(!response.ok) alert((await response.json()).message);
    }catch(error){ console.error('Error stopping the repetition:', error); }
    updateGraph();
  };
  function renderStopButton(lowerLevel){
    const btn = document.getElementById('stop-round-btn');
    const asked = stopPending || stopRound !== null;
    btn.disabled = !sessionRunning || lowerLevel || asked || !!sessionEnd;
    btn.textContent = asked && !sessionEnd ? (stopRound === null ? '⏹ stopping…' : `⏹ stopping after round ${stopRound}…`) : '⏹ stop after round';
    btn.title = sessionEnd ? 'the session has ended'
      : !sessionRunning ? 'no session is running'
      : lowerLevel ? "a lower level runs the rounds of its upper level: stop the session from the upper level's manager"
      : asked ? 'the server ends the session after its current round'
      : 'end the session after its current round: the clients are disconnected, the reports written (checkpoint, ONNX)';
  }
  document.getElementById('stop-round-btn').onclick = async ()=>{
    stopPending = true; renderStopButton(false);
    try{
      const response = await fetch('/pybiscus-session/stop-after-round', {method:'POST', headers:{'X-Pybiscus':'1'}});
      if(!response.ok){ stopPending = false; alert((await response.json()).message); }
    }catch(error){ stopPending = false; console.error('Error stopping the session after its round:', error); }
    updateGraph();
  };
  document.getElementById('cfg-btn').onclick = ()=>{ if(serverUrl) openSessionConfig(sessionConfigUrl(serverUrl)); };
  addEventListener('keydown', e=>{ if(e.key==='Escape') closeSessionConfig(); });

  // config iframe → run session
  window.addEventListener("message", (event)=>{
    if(event.data?.type === "session_config"){
      const wanted = event.data?.value?.min_clients;
      if(wanted != null && wanted !== registeredClients
         && !confirm(`min_clients = ${wanted}, while ${registeredClients} client(s) are registered.\n\n${minClientsRisk(wanted, registeredClients, !!event.data?.value?.data_partition)}\n\nLaunch the session anyway?`)){
        return;
      }
      closeSessionConfig();
      session.sessionState = "paramsDefined";
      const presets = encodeURIComponent(JSON.stringify(event.data?.value));
      fetch(`/pybiscus-session/run?presets=${presets}`, {method:'POST', headers:{'X-Pybiscus':'1'}})
        .then(r=>{ if(r.status===409) r.json().then(answer=>alert(answer.message)); })
        .catch(err=>console.error('Error running pybiscus session:', err));
    }
  });

  // drop session
  document.getElementById("revokeBtn").addEventListener("click", async ()=>{
    session.stop();
    try{
      const response = await fetch("/pybiscus-session/params", {method:"DELETE", headers:{"Content-Type":"application/json", "X-Pybiscus":"1"}});
      if(!response.ok) throw new Error(`HTTP error: ${response.status}`);
      await response.json();

      // l'état de session vit dans une foule de variables de module (courbes, vignettes,
      // états d'agents) : le rechargement est le seul reset exhaustif
      window.location.reload();
      return;
    }catch(error){ console.error("Error :", error); }
    updateGraph();
  });

  // ============ vignettes : matrice layers × rounds ============
  // id reçu = "col_row" avec col = round (rnd-1), row = layer (cf. plugin visualize_model_layers)
  const vign = { seen:new Set(), maxCol:-1, maxRow:-1 };
  const vmatrix = document.getElementById('vmatrix');

  function renderVignetteMatrix(){
    const cols=vign.maxCol+1, rows=vign.maxRow+1;
    if(cols<1 || rows<1){ vmatrix.innerHTML='<div class="empty">no vignettes yet</div>'; vmatrix.style.gridTemplateColumns=''; return; }
    vmatrix.style.gridTemplateColumns=`auto repeat(${cols}, minmax(46px,56px))`;
    let h='<div class="vm-corner">layer \\ round</div>';
    for(let c=0;c<cols;c++) h+=`<div class="vm-col">${c+1}</div>`;      // en-tête colonnes = rounds
    for(let r=0;r<rows;r++){                                            // une ligne par layer
      h+=`<div class="vm-row">L${r}</div>`;
      for(let c=0;c<cols;c++){
        const id=`${c}_${r}`;
        h+= vign.seen.has(id)
          ? `<img class="vm-cell" src="${VIGNETTES_URL}/grid_${id}.png" data-id="${id}" title="round ${c+1} · layer ${r}">`
          : `<div class="vm-cell empty-cell"></div>`;
      }
    }
    vmatrix.innerHTML=h;
  }

  function updateVignettes(){
    fetchFeed('/pybiscus-session/vignettes', data=>{
      let changed=false;
      data.forEach(id=>{
        if(vign.seen.has(id)) return;
        const p=String(id).split('_'); const c=parseInt(p[0],10), r=parseInt(p[1],10);
        if(isNaN(c)||isNaN(r)) return;
        vign.seen.add(id); vign.maxCol=Math.max(vign.maxCol,c); vign.maxRow=Math.max(vign.maxRow,r); changed=true;
      });
      if(changed) renderVignetteMatrix();
    }).catch(console.error);
  }

  // aperçu flottant au survol (délégation)
  const preview=document.querySelector('.preview-float');
  vmatrix.addEventListener('mouseover', e=>{ if(e.target.tagName==='IMG' && e.target.src){ preview.src=e.target.src; preview.style.opacity=1; } });
  vmatrix.addEventListener('mouseout',  e=>{ if(e.target.tagName==='IMG') preview.style.opacity=0; });

  // ============ splitter dragable (hauteur des feeds) ============
  (function(){
    const splitter=document.getElementById('splitter'), grid=document.querySelector('.grid');
    let dragging=false;
    splitter.addEventListener('mousedown', e=>{ dragging=true; document.body.style.userSelect='none'; e.preventDefault(); });
    addEventListener('mousemove', e=>{ if(!dragging) return;
      const rect=grid.getBoundingClientRect();
      let h=rect.bottom - e.clientY;                       // hauteur feeds = distance au bas de la grille
      h=Math.max(120, Math.min(rect.height-220, h));       // bornes : feeds >=120, haut >=220
      grid.style.setProperty('--feeds-h', h+'px');
    });
    addEventListener('mouseup', ()=>{ if(dragging){ dragging=false; document.body.style.userSelect=''; } });
  })();

  // ============ splitters verticaux (largeurs des colonnes) ============
  (function(){
    const grid=document.querySelector('.grid');
    function vdrag(el, apply){
      let d=false;
      el.addEventListener('mousedown', e=>{ d=true; document.body.style.userSelect='none'; e.preventDefault(); });
      addEventListener('mousemove', e=>{ if(d) apply(e.clientX); });
      addEventListener('mouseup', ()=>{ if(d){ d=false; document.body.style.userSelect=''; } });
    }
    // vsplit1 : largeur de la colonne gauche (topology/registration)
    vdrag(document.getElementById('vsplit1'), x=>{
      let w = x - grid.getBoundingClientRect().left;
      w = Math.max(180, Math.min(grid.clientWidth-520, w));
      grid.style.setProperty('--cw1', w+'px');
    });
    // vsplit2 : largeur de la colonne du milieu (accuracy/loss) ; vignettes (1fr) absorbe le reste
    vdrag(document.getElementById('vsplit2'), x=>{
      let w = x - document.querySelector('.col-mid').getBoundingClientRect().left;
      w = Math.max(220, Math.min(grid.clientWidth-260, w));
      grid.style.setProperty('--cw2', w+'px');
    });
  })();

  // ============ start loops ============
  session.startCallback(fetchAgents, 5000);
  session.startCallback(fetchLogs, 5000);
  session.startCallback(fetchMetrics, 5000);
  session.startCallback(updateGraph, 2000);
  session.startCallback(updateVignettes, 1000);
</script>
</body>
</html>
