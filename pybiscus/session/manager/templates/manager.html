<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FL Manager</title>
    <style>
        /* Assurer que html et body occupent 100% de la hauteur */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            height: 60px;
            background-color: #4a90e2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .split-container {
            display: flex;
            flex-grow: 1; /* Assurer que ce conteneur occupe tout l'espace restant */
            width: 100%;
            height: 100%;
            /* height: calc(100vh - 60px); /* Prendre toute la hauteur restante (moins la hauteur de l'en-tête) */
        }

        .left, .right {
            flex: 1;
            box-sizing: border-box;
            display: flex;
            flex-direction: column; /* Alignement vertical si nécessaire */
        }

        .left {
            flex: 0 0 620px; /* Fixe la largeur à 33% */
        }
 
        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .container-center {
            display: flex;
            justify-content: center;
        }

        .right p {
            margin: 1rem;
            font-size: 1rem;
        }

        .right div {
            flex: 1;
            border-top: 1px solid #ccc;
            background-color: #f0f0f0;
            padding: 1rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <div class="container-center">
            <h1>🧠 Federated Learning Manager</h1>
        </div>
    </header>
    
    <div class="split-container">

        <div class="left">
            <iframe id="agent-frame" src="/pybiscus-session/show_agents"></iframe>
        </div>
        <div class="right">
            <div id="button-container">
                Pybiscus Server Agent URL : <strong  id="server-url-display"></strong>
            </div>

            <iframe id="info-frame" src="/pybiscus-session/show_blank" width="100%" height="400px"></iframe>
        </div>
    </div>

    <script>

        let serverUrl = "";

        const aframe    = document.getElementById('agent-frame');
        const iframe    = document.getElementById('info-frame');
        const serverUrldisplay = document.getElementById("server-url-display");

        serverUrldisplay.textContent = serverUrl;

        window.addEventListener("message", (event) => {

            if (event.data?.type === "server_url") {

                if( serverUrl === "" ) {
                    serverUrl = event.data.value;
                    serverUrldisplay.textContent = serverUrl;

                    iframe.src = `${serverUrl}/session/config`;
                }

            } else if (event.data?.type === "session_config") {

                const aframeWindow = aframe.contentWindow;
                aframeWindow.sessionState = "paramsDefined";
                iframe.src = '/pybiscus-session/show_run';
                
                // console.log("EVT session_config")

                const presets = encodeURIComponent(JSON.stringify(event.data?.value));

                // say to back-end that session is running
                fetch(`/pybiscus-session/run?presets=${presets}`)
                .catch(error => {
                    console.error('Error running pybiscus session:', error);
                });
            }
        });

    </script>
</body>
</html>
