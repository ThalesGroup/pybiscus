<!DOCTYPE html>
<html>
<head>
    <title>Manager Dashboard</title>
    <style>
        canvas { margin-top: 0rem; border: 1px solid #ccc; background: #f9f9f9; }
        body { font-family: Arial, sans-serif; text-align: center; }

        .section-container {
        width: 600px;
        display: flex;
        flex-direction: column;
        }

        .list-box {
        flex: 1;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        background: #f0f0f0;
        border-radius: 5px;
        min-height: 0;
        max-height: 500px;
        }

        .entry {
        background: #fff;
        padding: 8px;
        margin-bottom: 6px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-align: left;
        }

        .entry-source {
        font-weight: bold;
        color: #333;
        }

        .entry-message {
        margin-top: 4px;
        color: #555;
        white-space: pre-line;
        }

        .btn {
        margin-top: 10px;
        margin-right: 10px;
        padding: 6px 12px;
        font-size: 14px;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        }

        .reset-btn {
        background-color: #d9534f;
        }

        .reset-btn:hover {
        background-color: #c9302c;
        }

        .pause-btn {
        background-color: #5bc0de;
        }

        .pause-btn:hover {
        background-color: #31b0d5;
        }

    </style>
</head>
<body>

    <script src="{{ url_for('static', filename='js/session_utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/session_graphics.js') }}"></script>

    <canvas id="graph" width="600" height="585"></canvas><br>
    <button id="revokeBtn">Drop session</button>
    <div id="resultat"></div>

    <!-- Agents -->
    <div class="section-container">
      <h3>Agents logs</h3>
      <button id="reset-agents-btn" class="btn reset-btn">Reset</button>
      <button id="pause-agents-btn" class="btn pause-btn">Pause</button>
      <div id="agents-list" class="list-box"></div>
    </div>

    <script>

        // **************************************

        var session = new Session();

        // ******************************
        // **** agents log **************
        // ******************************

        const AGENTS_URL  = 'http://localhost:{{manager_port}}/pybiscus-session/agents_logs';
        const agentsList = document.getElementById('agents-list');
        let displayedAgents = [];
        let agentsPaused = false;

        document.getElementById('reset-agents-btn').onclick = () => {
        agentsList.innerHTML = '';
        displayedAgents = [];
        };

        document.getElementById('pause-agents-btn').onclick = (e) => {
        agentsPaused = !agentsPaused;
        e.target.textContent = agentsPaused ? 'Resume' : 'Pause';
        };

        function addEntries(container, entriesArray, newItems, type) {
            newItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'entry';

                const src = document.createElement('span');
                src.className = 'entry-source';
                src.textContent = `[${item.source || type}] `;

                const msg = document.createElement('span');
                msg.className = 'entry-message';
                msg.textContent = item.message || JSON.stringify(item);

                div.appendChild(src);
                div.appendChild(msg);
                container.appendChild(div);
                entriesArray.push(div);

                if (entriesArray.length > 100) {
                    const removed = entriesArray.shift();
                    removed.remove();
                }

                // trigger actions according to log msg

                const match = item.source.match(/.*?:(.*)$/);
                if (match) {
                    const agentName = match[1];
                    // console.log("Agent name:", agentName);

                    if (item.message.endsWith("checking yaml file")) {
                        session.setAgentState(agentName, "validating");
                    } else if (item.message.endsWith("yaml file checked successfully")) {
                        session.setAgentState(agentName, "validated");
                    } else if (item.message.endsWith("launching pybiscus server")) {
                        session.setAgentState(agentName, "executing");
                    } else if (item.message.endsWith("launching pybiscus client")) {
                        session.setAgentState(agentName, "executing");
                    } else if (item.message.endsWith("pybiscus run completed")) {
                        session.setAgentState(agentName, "terminated");
                        sessionGraph.rotation_increment = 0;
                    } else if (item.message.endsWith("Validation error !")) {
                        session.setAgentState(agentName, "not validated");
                    }
                }                
            });
            container.scrollTop = container.scrollHeight;
        }

        function fetchAgents() {
            if (agentsPaused) return;
            fetch(AGENTS_URL)
                .then(res => res.json())
                .then(data => {
                const newAgents = data;
                if (newAgents.length) addEntries(agentsList, displayedAgents, newAgents, 'agents');
                })
                .catch(console.error);
        }

        session.startCallback(fetchAgents, 5000);

        // **************************************

        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');

        // **************************************
        // **** metric difference management ****
        // **************************************

        const maxMectricDiffs = 30;

        var metricDiffs = new CircularBuffer( maxMectricDiffs );

        // ******************************
        // **** durations management ****
        // ******************************

        const maxDurations = 6;

        var durations = new CircularBuffer( maxDurations );

        // ******************************
        // **** accuracy management *****
        // ******************************

        const maxAccuracies = 40;

        var fit_accuracies      = new CircularBuffer( maxAccuracies );
        var test_accuracies     = new CircularBuffer( maxAccuracies );
        var evaluate_accuracies = new CircularBuffer( maxAccuracies );

        // ******************************
        // **** graph management ********
        // ******************************

        let server_url = ""

        var sessionGraph = new SessionGraph();

        function updateGraph() {
            fetch('/pybiscus-session/agents')
                .then(res => res.json())
                .then(data => {

                    const servers_names = Object.keys(data.servers);
                    const clients_names = Object.keys(data.clients);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    drawDurations(ctx, durations.all,
                        { originX: 10, originY: 80 } );                    
                    drawSparkbar(ctx, metricDiffs.all, 
                        { originX: 320, originY: 40 } );
                    sessionGraph.draw(ctx, session, servers_names, clients_names, 
                        { centerX: 300, centerY: 240} );

                    ctx.font = '16px sans-serif';
                    ctx.beginPath();
                    ctx.fillText("Accuracies", 5, 392 );
                    ctx.font = '12px sans-serif';
                    ctx.beginPath();
                    ctx.fillText("Fit", 5, 444 );
                    drawAccuracyBars(ctx, fit_accuracies.all,
                        { originX: 36, originY: 460, maxAccuracies: fit_accuracies.maxSize, alignment: 'right' } );
                    ctx.beginPath();
                    ctx.fillText("Test", 5, 504 );
                    drawAccuracyBars(ctx, test_accuracies.all,
                        { originX: 36, originY: 520, maxAccuracies: test_accuracies.maxSize, alignment: 'right' } );
                    ctx.beginPath();
                    ctx.fillText("Eval", 5, 564 );
                    drawAccuracyBars(ctx, evaluate_accuracies.all, 
                        { originX: 36, originY: 580, maxAccuracies: evaluate_accuracies.maxSize, alignment: 'right' } );

                    // propagate first server URL definition
                    if( server_url === "" && servers_names.length > 0 ) {

                        const servers_data = Object.values(data.servers);

                        // info stored : name -> url
                        server_url = servers_data[0];
                        window.parent.postMessage({ type: "server_url", value: server_url }, "*");
                    }
                });
        }

        session.startCallback(updateGraph, 2000);  // Refresh every 2 seconds

        document.getElementById("revokeBtn").addEventListener("click", async () => {
        try {

            const parentWindow = window.parent;
            const siblingIframe = parentWindow.document.getElementById('info-frame');
            siblingIframe.src = "/pybiscus-session/show_blank";

            const response = await fetch("/pybiscus-session/params", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
            });

            if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
            }

            const data = await response.json();

        } catch (error) {
            console.error("Error :", error);
        }
        });

    </script>
</body>
</html>
