
<div class="pybiscus-box">
    <div class="pybiscus-columns">
        <div class="pybiscus-control-stack">
            <button class="pybiscus-button execute" id="launch-session-button"><span class="emoji">🚀</span> Run session</button>
            <span id="check-indicator" class="pybiscus-indicator">Running session...</span>
            <span id="check-success-result" class="pybiscus-success">'Session success !'</span>
            <span id="check-failure-result" class="pybiscus-failure">'Session failure.'</span>
        </div>
    </div>


    <button id="themeButton" type="button" class="themes_button" style="margin-right: 20px;" onclick="themeCycle()">🌓</button>

    <button id="lightModeButton" type="button" class="themes_button" onclick="setMode('light')">🌞</button>
    <button id="darkModeButton" type="button" class="themes_button" onclick="setMode('dark')">🌙</button>
    <span class="pybiscus-lu-setting" title="Long option lists (strategies…)">
        <button id="largeUnionMode-chips"  type="button" class="themes_button" title="Long lists: chips (+ radial menu)" onclick="pybiscusLargeUnions.setMode('chips')">◉</button>
        <button id="largeUnionMode-radial" type="button" class="themes_button" title="Long lists: radial menu" onclick="pybiscusLargeUnions.setMode('radial')">◎</button>
        <button id="largeUnionMode-column" type="button" class="themes_button" title="Long lists: column" onclick="pybiscusLargeUnions.setMode('column')">☰</button>
    </span>

</div>
