<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pybiscus Agent Registration</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    {{ pybiscus_theme_head() | safe }}
    <style>
        :root { --line: var(--border); --faint: var(--dim); --accent-ink: var(--on-ok);
                --error: var(--danger-text); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2.5rem 1rem;
        }

        .container { width: 100%; max-width: 640px; }

        .header { margin-bottom: 1.5rem; }
        .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.35rem; }
        .top .kicker { margin-bottom: 0; }

        .kicker {
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }

        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.35rem; }

        .subtitle { color: var(--muted); font-size: 0.95rem; }

        fieldset {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 1rem 1.1rem 0.2rem;
            margin-bottom: 1.1rem;
        }

        legend {
            padding: 0 0.4rem;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 0.9rem; }

        .form-row { display: flex; flex-wrap: wrap; gap: 0 1rem; }
        .form-row > .form-group { flex: 1 1 200px; }

        label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--text-soft);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            min-height: 2.5rem;
            padding: 0.55rem 0.75rem;
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        input::placeholder { color: var(--faint); }

        input:focus, select:focus, button:focus-visible {
            outline: 2px solid var(--ok);
            outline-offset: 1px;
        }

        input[readonly] { color: var(--muted); background: var(--panel-2); cursor: not-allowed; }

        .geo-location-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }

        .toggle-btn {
            min-height: 2.25rem;
            padding: 0 0.9rem;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel-2);
            color: var(--label);
            font: inherit;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .toggle-btn.active { border-color: var(--ok); color: var(--text); background: var(--ok-tint); }

        .coordinates-group { display: none; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .coordinates-group.active { display: grid; }
        .text-location-group.hidden { display: none; }

        .btn {
            width: 100%;
            min-height: 3rem;
            padding: 0 2rem;
            margin-top: 0.4rem;
            background: var(--ok);
            color: var(--accent-ink);
            border: 1px solid var(--ok);
            border-radius: 6px;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover { filter: brightness(1.08); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid color-mix(in srgb, var(--accent-ink) 30%, transparent);
            border-top-color: var(--accent-ink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .field-hint { margin-top: 0.35rem; font-size: 0.8rem; color: var(--muted); }
        .field-hint.warn { color: var(--warn); }

        .result {
            margin-top: 1.25rem;
            padding: 0.9rem 1rem;
            border-radius: 6px;
            display: none;
        }

        .result.success { background: var(--done-bg); border: 1px solid var(--done-line); color: var(--done-text); }
        .result.error { background: var(--err-bg); border: 1px solid var(--danger-border); color: var(--error); }

        .result-icon { display: inline-block; margin-right: 0.5rem; }

        @media (max-width: 640px) {
            .coordinates-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="top"><div class="kicker">PYBISCUS · AGENT</div><button type="button" class="pybiscus-theme-toggle" title="dark / light theme">🌓</button></div>
            <h1>Join a session</h1>
            <p class="subtitle">Give the manager's address and its session token, then describe this agent.</p>
        </div>

        <form id="registrationForm">

            <fieldset>
                <legend>Connection</legend>

                <div class="form-group">
                    <label for="managerUrl">Manager URL</label>
                    <input type="url" id="managerUrl" name="managerUrl" required
                           value="{{ config.get('manager_url', 'http://manager.pybiscus.org:5555') }}">
                </div>

                <div class="form-group">
                    <label for="sessionToken">Session token</label>
                    <input type="password" id="sessionToken" name="sessionToken" autocomplete="off"
                           placeholder="if the manager requires one" value="{{ session_token }}"
                           aria-describedby="sessionTokenHint">
                    <div class="field-hint" id="sessionTokenHint">Shown by the manager's Session token button.</div>
                </div>

                <div class="form-group">
                    <label for="bouquet">Bouquet</label>
                    <input type="text" id="bouquet" name="bouquet" required
                           value="{{ config.get('bouquet', '') }}" aria-describedby="bouquetHint">
                    <div class="field-hint" id="bouquetHint"></div>
                </div>
            </fieldset>

            <fieldset>
                <legend>This agent</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required value="{{ config.get('agent_name', 'cortaix-labs-01') }}">
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="client" {% if config.get('role', 'client') == 'client' %}selected{% endif %}>Client</option>
                            <option value="server" {% if config.get('role', 'client') == 'server' %}selected{% endif %}>Server</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="organisation">Organisation</label>
                    <input type="text" id="organisation" name="organisation" required
                           value="{{ config.get('organisation', 'CortaiX Labs') }}">
                </div>

                <div class="form-group">
                    <label for="baseUrl">Agent URL</label>
                    <input type="url" id="baseUrl" name="baseUrl" required
                           value="{{ config.get('agent_url', 'http://agent.pybiscus.org:5001') }}" aria-describedby="baseUrlHint">
                    <div class="field-hint" id="baseUrlHint">How the manager and the other agents reach this one.</div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Location on the map</legend>

                <div class="form-group">
                    <label for="location">Site</label>
                    <input type="text" id="location" name="location" required
                           value="{{ config.get('location', 'paris-dc-01') }}">
                </div>

                <div class="form-group">
                    <div class="geo-location-toggle" role="group" aria-label="Geo location as">
                        <button type="button" class="toggle-btn {% if config.get('geo_location', {}).get('type', 'text') == 'text' %}active{% endif %}" id="textToggle">Place name</button>
                        <button type="button" class="toggle-btn {% if config.get('geo_location', {}).get('type', 'text') == 'coordinates' %}active{% endif %}" id="coordsToggle">Coordinates</button>
                    </div>

                    <div class="text-location-group" id="textLocationGroup">
                        <label for="geoLocationText">Place name</label>
                        <input type="text" id="geoLocationText" name="geoLocationText" required
                               value="{{ config.get('geo_location', {}).get('text', 'Paris, France') }}">
                    </div>

                    <div class="coordinates-group" id="coordinatesGroup">
                        <div>
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" name="latitude" step="any"
                                   placeholder="48.8566" value="{{ config.get('geo_location', {}).get('latitude', 48.8566) }}">
                        </div>
                        <div>
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" name="longitude" step="any"
                                   placeholder="2.3522" value="{{ config.get('geo_location', {}).get('longitude', 2.3522) }}">
                        </div>
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                Register
            </button>
        </form>

        <div class="result" id="result" role="status">
            <span class="result-icon" id="resultIcon"></span>
            <span id="resultMessage"></span>
        </div>
    </div>

    <script>
        // Configuration from server
        const serverConfig = {
            geoLocationType: "{{ config.get('geo_location', {}).get('type', 'text') }}"
        };
        
        // Geo location toggle functionality
        let isCoordinatesMode = serverConfig.geoLocationType === 'coordinates';

        document.getElementById('textToggle').addEventListener('click', () => {
            isCoordinatesMode = false;
            updateGeoLocationMode();
        });

        document.getElementById('coordsToggle').addEventListener('click', () => {
            isCoordinatesMode = true;
            updateGeoLocationMode();
        });

        function updateGeoLocationMode() {
            const textToggle   = document.getElementById('textToggle');
            const coordsToggle = document.getElementById('coordsToggle');
            const textGroup    = document.getElementById('textLocationGroup');
            const coordsGroup  = document.getElementById('coordinatesGroup');
            const textInput    = document.getElementById('geoLocationText');
            const latInput     = document.getElementById('latitude');
            const lngInput     = document.getElementById('longitude');

            if (isCoordinatesMode) {
                textToggle.classList.remove('active');
                coordsToggle.classList.add('active');
                textGroup.classList.add('hidden');
                coordsGroup.classList.add('active');
                textInput.removeAttribute('required');
                latInput.setAttribute('required', 'required');
                lngInput.setAttribute('required', 'required');
            } else {
                textToggle.classList.add('active');
                coordsToggle.classList.remove('active');
                textGroup.classList.remove('hidden');
                coordsGroup.classList.remove('active');
                textInput.setAttribute('required', 'required');
                latInput.removeAttribute('required');
                lngInput.removeAttribute('required');
            }
        }

        function getGeoLocationValue(formData) {
            if (isCoordinatesMode) {
                const latitude = parseFloat(formData.get('latitude'));
                const longitude = parseFloat(formData.get('longitude'));
                
                if (isNaN(latitude) || isNaN(longitude)) {
                    throw new Error('Invalid latitude or longitude values');
                }
                
                return {
                    latitude: latitude,
                    longitude: longitude
                };
            } else {
                const textValue = formData.get('geoLocationText');
                if (!textValue || textValue.trim() === '') {
                    throw new Error('Geo location text cannot be empty');
                }
                return textValue.trim();
            }
        }

        function showResult(success, message) {
            const result    = document.getElementById('result');
            const icon      = document.getElementById('resultIcon');
            const messageEl = document.getElementById('resultMessage');
            
            result.className      = `result ${success ? 'success' : 'error'}`;
            icon.textContent      = success ? '✅' : '❌';
            messageEl.textContent = message;
            result.style.display  = 'block';
        }

        function hideResult() {
            document.getElementById('result').style.display = 'none';
        }

        // kept once: the button's textContent below takes the spinner out of the page, and looked
        // up again it was null, so that no attempt could follow a failed registration
        const spinner = document.getElementById('spinner');

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');

            btn.disabled = loading;
            spinner.style.display = loading ? 'inline-block' : 'none';
            btn.textContent = loading ? ' Registering...' : 'Register';
            
            if (loading) {
                btn.prepend(spinner);
            }
        }

        // the bouquet of the session joined: the manager's own, set and locked here once the manager
        // answers; it refuses (or warns about) an agent declaring another one
        const configBouquet = {{ config.get('bouquet') | tojson }};
        const bouquetInput = document.getElementById('bouquet');
        let identityRequest = 0;

        function bouquetHint(text, warn) {
            const hint = document.getElementById('bouquetHint');
            hint.textContent = text;
            hint.className = 'field-hint' + (warn ? ' warn' : '');
        }

        // the colour of a bouquet is computed by the manager's script, the one of its pages
        function loadBouquetColor(managerUrl) {
            if (window.bouquetColor) return Promise.resolve();
            return new Promise(resolve => {
                const script = document.createElement('script');
                script.src = `${managerUrl}/static/pybiscus/js/bouquet_color.js`;
                script.onload = script.onerror = resolve;
                document.head.appendChild(script);
            });
        }

        async function followManagerBouquet() {
            const request = ++identityRequest;
            const managerUrl = document.getElementById('managerUrl').value.trim().replace(/\/$/, '');
            const token = document.getElementById('sessionToken').value;
            bouquetInput.readOnly = false;
            bouquetInput.style.borderColor = bouquetInput.style.boxShadow = '';
            bouquetHint('');
            if (!managerUrl) return;
            try {
                const response = await fetch(`${managerUrl}/pybiscus-session/identity`, {
                    mode: 'cors',
                    headers: {'X-Pybiscus': '1', ...(token ? {'Authorization': 'Bearer ' + token} : {})}
                });
                if (request !== identityRequest) return;
                if (!response.ok) {
                    bouquetHint(response.status === 401 || response.status === 403
                        ? 'the manager asks for its session token: the bouquet is checked at registration'
                        : `the manager answered HTTP ${response.status}: the bouquet is checked at registration`);
                    return;
                }
                const identity = await response.json();
                if (!identity.bouquet) {
                    bouquetHint("this manager's session has no bouquet: the agent declares its own");
                    return;
                }
                await loadBouquetColor(managerUrl);
                if (request !== identityRequest) return;
                bouquetInput.value = identity.bouquet;
                bouquetInput.readOnly = true;
                const colour = identity.color || (window.bouquetColor ? bouquetColor(identity.bouquet) : null);
                if (colour) {
                    bouquetInput.style.borderColor = colour;
                    bouquetInput.style.boxShadow = `0 0 0 2px ${colour}`;
                }
                const differs = configBouquet && configBouquet !== identity.bouquet;
                bouquetHint(`set by the manager: its session is the bouquet ${identity.bouquet}`
                    + (differs ? ` (this agent's configuration says ${configBouquet}: is it the right manager?)` : ''), differs);
            } catch (error) {
                if (request === identityRequest) bouquetHint('the manager cannot be reached: the bouquet is checked at registration');
            }
        }

        for (const id of ['managerUrl', 'sessionToken']) {
            document.getElementById(id).addEventListener('change', followManagerBouquet);
        }
        window.addEventListener('load', followManagerBouquet);

        async function notifyAgentBackEnd(formData, managerUrl) {

            // this page is served by the agent to notify, hence a relative URL: baseUrl is how
            // OTHER hosts reach the agent (possibly a public name), not necessarily this page's origin
            const endpoint = '/session/agent/registration';
            
            const geoLocation = getGeoLocationValue(formData);
            
            const payload = {
                'name':         formData.get('name'),
                'agent_url':    formData.get('baseUrl'),
                'bouquet':      formData.get('bouquet'),
                'location':     formData.get('location'),
                'geo_location': geoLocation,
                'organisation': formData.get('organisation'),
                'role':         formData.get('role'),
                'manager_url':  managerUrl,
                'session_token': formData.get('sessionToken'),
            };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Pybiscus': '1'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} - ${response.statusText}`);
                }

                const theJson = await response.json();
                console.log(`📡 Agent response:`, theJson);

                if (theJson.status === "ok") {
                    const name = formData.get('name');
                    console.log(`✅ Agent '${name}' acknowledged.`);
                    return { success: true, message: `Agent '${name}' acknowledged successfully` };
                } else {
                    console.log('❌ Agent rejected acknowledgment');
                    return { success: false, message: 'Agent did not acknowledge (rejected)' };
                }

            } catch (error) {
                console.log(`❌ Registration failed: ${error.message}`);
                return { success: false, message: `Registration failed: ${error.message}` };
            }
        }

        async function registerAgent(formData, managerUrl) {

            const registrationUrl = `${managerUrl.replace(/\/$/, '')}/pybiscus-session/agent`;
            
            const geoLocation = getGeoLocationValue(formData);
            
            const payload = {
                application:  'Pybiscus',
                name:         formData.get('name'),
                agent_url:    formData.get('baseUrl'),
                bouquet:      formData.get('bouquet'),
                location:     formData.get('location'),
                geo_location: geoLocation,
                organisation: formData.get('organisation'),
                role:         formData.get('role'),
                // the manager shares the cores of a machine between its clients (num_threads)
                machine:      {{ machine | tojson }},
                cpu_cores:    {{ cpu_cores | tojson }},
            };
            
            const response = await fetch(registrationUrl, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-Pybiscus': '1',
                    'Authorization': 'Bearer ' + formData.get('sessionToken')
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let errorMessage;
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.message || errorData.error || `HTTP ${response.status}`;
                } catch {
                    errorMessage = `HTTP ${response.status} - ${response.statusText}`;
                }
                throw new Error(errorMessage);
            }

            const data = await response.json();
            return [data.message || 'Client registered successfully', data];
        }

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideResult();
            setLoading(true);

            const formData = new FormData(e.target);

            const managerUrl = formData.get('managerUrl');

            try {
                const [message, payload] = await registerAgent(formData, managerUrl);
                showResult(true, message + (payload.warning ? ` ⚠️ ${payload.warning}` : ''));

                notifyAgentBackEnd(formData, managerUrl)

                setTimeout(() => {
                    window.location.href = "/session/agent/registration/waiting";
                }, 3000);

            } catch (error) {
                showResult(false, error.message);
            } finally {
                setLoading(false);
            }
        });
        
        // Add some input validation and formatting
        document.getElementById('name').addEventListener('input', (e) => {
            // Auto-generate name suggestion
            const value = e.target.value;
            if (value && !value.includes('-')) {
                // Could suggest format like "cortaix-labs-XX"
            }
        });

        // Initialize the geo location mode
        updateGeoLocationMode();
    </script>
</body>
</html>
