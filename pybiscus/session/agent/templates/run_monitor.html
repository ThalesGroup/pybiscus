<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pybiscus - Run</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(1000px 600px at 80% -10%, #16202b 0%, transparent 60%), #0e1116;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .title { display: flex; flex-direction: column; gap: .15rem; }

        .kicker {
            font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
            font-size: .75rem;
            letter-spacing: .14em;
            color: #8b96a3;
        }

        h1 { font-size: 1.35rem; font-weight: 600; }

        h1 .where { font-weight: 400; color: #8b96a3; }

        .mode-badge {
            padding: .25rem .75rem;
            border-radius: 999px;
            border: 1px solid #232c37;
            background: #151a21;
            color: #b7c2ce;
            font-size: .8rem;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .4rem .9rem;
            border-radius: 999px;
            border: 1px solid #232c37;
            background: #151a21;
            font-weight: 600;
            font-size: .9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #b7c2ce;
        }

        .status-running .status-dot { background: #ff5d73; animation: blink 1.4s ease-in-out infinite; }
        .status-running { color: #ff5d73; }
        .status-success .status-dot { background: #3fb950; }
        .status-success { color: #3fb950; }
        .status-failure .status-dot { background: #f85149; }
        .status-failure { color: #f85149; }
        .status-stopped .status-dot { background: #d29922; }
        .status-stopped { color: #d29922; }

        @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

        .toolbar {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }

        button, .toggle {
            font: inherit;
            font-size: .875rem;
            padding: .5rem .9rem;
            border-radius: 10px;
            border: 1px solid #232c37;
            background: #151a21;
            color: #e6edf3;
            cursor: pointer;
            transition: border-color .2s, color .2s;
        }

        button:hover:not(:disabled) { border-color: #4ecdc4; color: #4ecdc4; }
        button:disabled { opacity: .4; cursor: not-allowed; }

        .toggle { display: flex; align-items: center; gap: .5rem; cursor: pointer; }

        .console {
            background: #0b0f14;
            border: 1px solid #232c37;
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
            height: 65vh;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }

        pre {
            font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
            font-size: .82rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: #c9d1d9;
        }

        /* coloured by the run's status (setStatus): a success used to show in the red of a failure */
        .detail {
            font-size: .875rem;
            color: #b7c2ce;
            padding: .75rem 1rem;
            background: #151a21;
            border: 1px solid #232c37;
            border-radius: 8px;
        }

        .detail.status-success { color: #7ee2a8; background: #0f2a17; border-color: #238636; }
        .detail.status-failure { color: #ff8a86; background: #2d1416; border-color: #8e2b2b; }
        .detail.status-stopped { color: #e3b341; background: #2b2111; border-color: #7d5a14; }

        .detail:empty { display: none; }

        /* progress of the run, read from the gui_events lines of its log */
        .progress {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            padding: 1rem 1.25rem;
            background: #11161d;
            border: 1px solid #232c37;
            border-radius: 14px;
        }

        .progress[hidden] { display: none; }

        .progress-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
        .progress-round { font-size: 1.15rem; font-weight: 600; }
        .progress-phase { color: #8b96a3; }
        .progress-end { margin-left: auto; color: #8b96a3; font-size: .875rem; }

        .progress-bar { height: 6px; border-radius: 3px; background: #1d2530; overflow: hidden; }
        .progress-bar[hidden] { display: none; }
        .progress-fill { height: 100%; width: 0; background: #4ecdc4; transition: width .4s; }

        .figures { display: flex; gap: .75rem; flex-wrap: wrap; }
        .figures:empty { display: none; }

        .figure {
            min-width: 9rem;
            padding: .5rem .8rem;
            border: 1px solid #232c37;
            border-radius: 10px;
            background: #151a21;
        }

        .figure-label { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #8b96a3; }
        .figure-value { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .figure-round { font-size: .75rem; color: #6b7682; }

        select {
            font: inherit;
            font-size: .875rem;
            padding: .45rem .7rem;
            border-radius: 10px;
            border: 1px solid #232c37;
            background: #151a21;
            color: #e6edf3;
        }
    </style>
</head>
<body>
    <div class="container">

        <header>
            <div class="title">
                <div class="kicker">PYBISCUS · RUN</div>
                <h1>{{ agent_name or 'Pybiscus run' }}{% if location %} <span class="where">· {{ location }}</span>{% endif %}</h1>
            </div>
            <span class="mode-badge" id="mode">{{ mode }}</span>

            <div class="status-pill" id="status-pill">
                <span class="status-dot"></span>
                <span id="status-label">connecting</span>
            </div>
        </header>

        <div class="toolbar">
            <button id="registration-button" style="display:none">← Back to registration</button>
            <button id="stop-button">■ Stop run</button>
            <button id="copy-button">⧉ Copy logs</button>
            <label class="toggle">
                <input type="checkbox" id="autoscroll" checked> Auto-scroll
            </label>
            <select id="log-filter" title="lines shown in the log">
                <option value="all">All lines</option>
                <option value="rounds">Rounds</option>
                <option value="problems">Warnings and errors</option>
            </select>
        </div>

        <div class="detail" id="detail"></div>

        <section class="progress" id="progress" hidden>
            <div class="progress-head">
                <span class="progress-round" id="progress-round"></span>
                <span class="progress-phase" id="progress-phase"></span>
                <span class="progress-end" id="progress-end"></span>
            </div>
            <div class="progress-bar" id="progress-bar" hidden><div class="progress-fill" id="progress-fill"></div></div>
            <div class="figures" id="figures"></div>
        </section>

        <div class="console" id="console"><pre id="log"></pre></div>
    </div>

    <script>
        const consoleDiv  = document.getElementById('console');
        const logPre      = document.getElementById('log');
        const statusPill  = document.getElementById('status-pill');
        const statusLabel = document.getElementById('status-label');
        const detailDiv   = document.getElementById('detail');
        const modeBadge   = document.getElementById('mode');
        const autoscroll  = document.getElementById('autoscroll');
        const stopButton  = document.getElementById('stop-button');
        const copyButton  = document.getElementById('copy-button');
        const regButton   = document.getElementById('registration-button');

        // ---------- progress, from the lines gui_events.py writes (the patterns are its own) ----------

        const GUI_PATTERNS = {{ gui_log_patterns | tojson }};
        const RE = Object.fromEntries(Object.entries(GUI_PATTERNS).map(([k, src]) => [k, new RegExp(src)]));

        // a server round: fit on the clients, test on the server, evaluate on the clients (StoppableServer)
        const SERVER_PHASES = ['fit', 'test', 'evaluate', 'done'];
        const NEXT_SERVER_PHASE = { fit: 'test', test: 'evaluate', evaluate: 'done' };
        const PHASE_TEXT = {
            server: { fit: 'training on the clients', test: 'testing on the server',
                      evaluate: 'evaluating on the clients', done: 'round finished' },
            client: { fit: 'training', fitted: 'trained, waiting for the evaluation',
                      evaluate: 'evaluating', done: 'round finished' },
        };
        const FIGURE_LABEL = { 'server fit': 'clients fit', 'server test': 'server test',
                               'server evaluate': 'clients evaluate', 'client fit': 'fit', 'client evaluate': 'evaluate' };

        let progress;

        function resetProgress() {
            progress = { side: null, round: null, counted: null, total: null, phase: null,
                         figures: {}, duration: null, end: null };
        }

        // true when the line is one of the run's events (the "Rounds" view of the log)
        function noteLine(line) {
            let m;
            if ((m = line.match(RE.round_start))) {
                Object.assign(progress, { side: 'server', round: +m[1], counted: +m[2], total: +m[3], phase: 'fit' });
                return true;
            }
            if ((m = line.match(RE.round_metric))) {
                const round = m[2] === '-' ? progress.round : +m[2];
                progress.figures['server ' + m[1]] = { metric: m[3], value: m[4], round };
                // a strategy without a server-side test logs no "test" metric: a later phase moves on too
                if (progress.side === 'server' && SERVER_PHASES.indexOf(m[1]) >= SERVER_PHASES.indexOf(progress.phase)) {
                    progress.phase = NEXT_SERVER_PHASE[m[1]];
                }
                return true;
            }
            if ((m = line.match(RE.client_phase))) {
                Object.assign(progress, { side: 'client', round: +m[2], phase: m[1] });
                return true;
            }
            if ((m = line.match(RE.client_metric))) {
                progress.figures['client ' + m[1]] = { metric: m[3], value: m[4], round: +m[2] };
                progress.phase = m[1] === 'fit' ? 'fitted' : 'done';
                return true;
            }
            if ((m = line.match(RE.duration))) {
                progress.duration = { value: +m[1], round: progress.round };
                return true;
            }
            if ((m = line.match(RE.rounds_done))) {
                Object.assign(progress, { counted: +m[1], total: +m[2] });
                return true;
            }
            if ((m = line.match(RE.session_end))) {
                progress.end = { done: +m[1], total: +m[2], reason: m[3] || null };
                return true;
            }
            return RE.round.test(line) || RE.stop_requested.test(line) || RE.no_evaluation.test(line) || RE.link.test(line);
        }

        function formatValue(text) {
            const value = parseFloat(text);
            return Number.isFinite(value) ? String(+value.toPrecision(4)) : text;
        }

        function figure(label, value, round) {
            const div = document.createElement('div');
            div.className = 'figure';
            div.innerHTML = '<div class="figure-label"></div><div class="figure-value"></div><div class="figure-round"></div>';
            div.children[0].textContent = label;
            div.children[1].textContent = value;
            div.children[2].textContent = round == null ? '' : `round ${round}`;
            return div;
        }

        function renderProgress() {
            const section = document.getElementById('progress');
            if (progress.side === null && progress.end === null) { section.hidden = true; return; }
            section.hidden = false;

            const roundText = document.getElementById('progress-round');
            const phaseText = document.getElementById('progress-phase');
            const endText   = document.getElementById('progress-end');
            const bar       = document.getElementById('progress-bar');

            if (progress.side === 'server' && progress.total) {
                roundText.textContent = `Round ${progress.counted} / ${progress.total}`;
                const done = progress.end ? progress.end.done
                           : progress.counted - 1 + (progress.phase === 'done' ? 1 : 0);
                bar.hidden = false;
                document.getElementById('progress-fill').style.width = `${Math.min(100, 100 * done / progress.total)}%`;
            } else {
                // a client is not told the number of rounds
                roundText.textContent = progress.round == null ? '' : `Round ${progress.round}`;
                bar.hidden = true;
            }

            phaseText.textContent = progress.end ? '' : (PHASE_TEXT[progress.side] || {})[progress.phase] || '';
            endText.textContent = !progress.end ? ''
                : progress.end.reason ? `stopped after ${progress.end.done} / ${progress.end.total} rounds: ${progress.end.reason}`
                : `${progress.end.done} / ${progress.end.total} rounds run`;

            const figures = document.getElementById('figures');
            figures.replaceChildren();
            for (const key of ['server fit', 'server test', 'server evaluate', 'client fit', 'client evaluate']) {
                const f = progress.figures[key];
                if (f) figures.appendChild(figure(`${FIGURE_LABEL[key]} · ${f.metric}`, formatValue(f.value), f.round));
            }
            if (progress.duration) {
                figures.appendChild(figure('round duration', `${progress.duration.value.toFixed(1)} s`, progress.duration.round));
            }
        }

        // ---------- log, with its views ----------

        const logFilter = document.getElementById('log-filter');
        const PROBLEM = /WARNING|ERROR|Error|Exception|Traceback|❌|failed/;
        let allLines = [];   // [line, isEvent]

        function shown([line, isEvent]) {
            return logFilter.value === 'all' || (logFilter.value === 'rounds' ? isEvent : PROBLEM.test(line));
        }

        function scrollIfFollowing() {
            if (autoscroll.checked) {
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        }

        function appendLines(lines) {
            const entries = lines.map(line => [line, noteLine(line)]);
            allLines.push(...entries);
            const visible = entries.filter(shown).map(([line]) => line);
            if (visible.length) logPre.textContent += visible.join('\n') + '\n';
            renderProgress();
            scrollIfFollowing();
        }

        function clearLog() {
            allLines = [];
            logPre.textContent = '';
            resetProgress();
            renderProgress();
        }

        logFilter.addEventListener('change', () => {
            const visible = allLines.filter(shown).map(([line]) => line);
            logPre.textContent = visible.length ? visible.join('\n') + '\n' : '';
            scrollIfFollowing();
        });

        resetProgress();

        function setStatus(status, detail) {
            statusPill.className = 'status-pill status-' + status;
            statusLabel.textContent = status;
            detailDiv.textContent = detail || '';
            detailDiv.className = 'detail status-' + status;
            const finished = (status === 'success' || status === 'failure' || status === 'stopped');

            stopButton.style.display = finished ? 'none' : '';
            stopButton.disabled = status !== 'running';

            // seul chemin de sortie, et seulement une fois le run fini : quitter la page en
            // cours de run couperait l'agent de la session (le retour à /{mode}/config
            // perdrait de toute façon les presets — cid, modèle, dataset — posés par le manager)
            regButton.style.display = finished ? '' : 'none';
        }

        function setMode(newMode) {
            if (!newMode) return;
            modeBadge.textContent = newMode;
        }

        const events = new EventSource('/run/events');

        events.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'snapshot') {
                setMode(data.mode);
                clearLog();
                appendLines(data.lines);
                setStatus(data.status, data.detail);

            } else if (data.type === 'reset') {
                setMode(data.mode);
                clearLog();
                setStatus('running', '');

            } else if (data.type === 'log') {
                appendLines([data.line]);

            } else if (data.type === 'status') {
                setStatus(data.status, data.detail);
            }
        };

        events.onerror = () => {
            statusLabel.textContent = 'disconnected';
            statusPill.className = 'status-pill';
        };

        stopButton.addEventListener('click', () => {
            stopButton.disabled = true;
            fetch('/run/stop', { method: 'POST', headers: { 'X-Pybiscus': '1' } });
        });

        // le contexte de l'agent (reset_session + reset_registration) est remis à zéro par
        // l'envoi du formulaire, pas par son affichage
        regButton.addEventListener('click', () => {
            window.location.href = '/session/agent/registration';
        });

        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(allLines.map(([line]) => line).join('\n'));
        });
    </script>
</body>
</html>
