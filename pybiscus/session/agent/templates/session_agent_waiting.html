<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pybiscus - Connecting</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    {{ pybiscus_theme_head() | safe }}
    <style>
        :root { --line: var(--border); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 2rem;
        }

        .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
        .top .kicker { margin-bottom: 0; }

        .kicker {
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.25rem; }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text);
            margin-bottom: 1.25rem;
        }

        .dots { display: inline-flex; gap: 0.3rem; }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ok);
            animation: blink 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.25; }
            40% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot { animation: none; opacity: 0.8; }
        }

        .info-text { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container" role="status">
        <div class="top"><div class="kicker">PYBISCUS · AGENT</div><button type="button" class="pybiscus-theme-toggle" title="dark / light theme">🌓</button></div>
        <h1>{{state}}</h1>

        <div class="status-indicator">
            <span>{{action}}</span>
            <span class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
        </div>

        <p class="info-text">{{explanation}}</p>
    </div>

    <script>

        {{callback | safe }}

    </script>
</body>
</html>
