root_dir: ${oc.env:PWD}
flower_server:
  listen_address: '[::1]:3333'
server_run:
  num_rounds: '5'
  clients_fit_local_epochs: '1'
  loggers:
  - name: rich
    config:
      empty_configuration: true
  reporting:
    basedir: ${root_dir}/experiments
    add_timestamp_in_path: true
    server_config_filename: config_server.yml
    save_on_train_end:
      filename: final_checkpoint.pt
server_compute_context:
  hardware:
    accelerator: cpu
    devices: auto
  metrics_loggers:
  - name: tensorboard
    config:
      subdir: tensorboard
server_strategy:
  pipeline:
  # FedMIA saves the parameters each client received and returned, then scores every privacy
  # example against each client's update (rounds/round_<n>/cosine_matrix.csv, loss_per_instances.csv)
  - name: fedmiaprivacyevaluation
    config:
      reporting_sub_dir: rounds
      criterion: CrossEntropyLoss
  - name: timediffcompute
    config:
      empty_configuration: true
  strategy:
    name: fedavgextended
    config:
      fraction_fit: '1'
      fraction_evaluate: '1'
      min_fit_clients: '2'
      min_evaluate_clients: '2'
      min_available_clients: '2'
      accept_failures: true
      inplace: true
data:
  name: cifar
  config:
    # the server evaluates on the official test split, and attacks examples of the train split:
    # example i of the privacy set is example i of the clients' partitions, which
    # "pybiscus data partition <client config> --export <dir>" writes out for the analyser
    test:
      dir: ${root_dir}/datasets/test/
      batch_size: 32
    privacy:
      dir: ${root_dir}/datasets/train/
      batch_size: 64
      max_samples: 2000
    num_workers: 0
model:
  name: cifar
  config:
    input_shape: '3'
    mid_shape: '6'
    n_classes: '10'
    lr: '0.001'
