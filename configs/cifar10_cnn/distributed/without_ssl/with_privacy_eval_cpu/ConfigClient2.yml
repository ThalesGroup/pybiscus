root_dir: ${oc.env:PWD}
flower_client:
  server_address: localhost:3333
client_run:
  cid: '1'
  pre_train_val: false
client_compute_context:
  hardware:
    accelerator: cpu
    devices: auto
model:
  name: cifar
  config:
    input_shape: '3'
    mid_shape: '6'
    n_classes: '10'
    lr: '0.001'
data:
  name: cifar
  config:
    dir_train: ${root_dir}/datasets/cifar10/train/
    data_train_indices_path: ${root_dir}/datasets/cifar10/2clients_splits/client_1_train.txt
    data_val_indices_path: ${root_dir}/datasets/cifar10/2clients_splits/client_1_val.txt
    dir_test: ${root_dir}/datasets/cifar10/test/
    batch_size: '32'
    num_workers: '0'
