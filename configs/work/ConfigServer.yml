root_dir: ${oc.env:PWD}
flower_server:
  listen_address: 'localhost:3333'
server_run:
  num_rounds: '100'
  clients_fit_local_epochs: '1'
  loggers: []
  reporting:
    basedir: ${root_dir}/experiments
    add_timestamp_in_path: true
    server_config_filename: config_server.yml
server_compute_context:
  hardware:
    accelerator: auto
    devices: auto
  metrics_loggers: []
server_strategy:
  pipeline:
  - name: fedmiaprivacyevaluation
    config:
      reporting_sub_dir: rounds
      cosine_matrix_path: cosine_matrix.csv
      losses_path: loss_per_instances.csv
      server_aggregated_fit_parameters_file_name: server_aggregated_fit_parameters.npz
      client_fitin_parameters_file_prefix: client_fitin_parameters
      client_fitres_parameters_file_prefix: client_fitres_parameters
      criterion: CrossEntropyLoss
      device: cpu
  strategy:
    name: fedavg
    config:
      min_fit_clients: '2'
data:
  name: cifar
  config:
    dir_train: ${root_dir}/datasets/cifar10/train/
    # dir_val: ${root_dir}/datasets/cifar10/val/
    dir_test: ${root_dir}/datasets/cifar10/train/
    batch_size: '32'
    num_workers: '0'
model:
  name: cifar
  config:
    input_shape: '3'
    mid_shape: '6'
    n_classes: '10'
    lr: '0.001'
