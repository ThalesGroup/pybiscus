      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      2: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      3: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
