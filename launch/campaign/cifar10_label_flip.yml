# Campaign of launch/campaign/strategy_campaign.py: the defenses against data poisoning. 2 attackers
# of 7 train on flipped labels (byzantine client plugin, attack label_flip: l -> 9 - l, the LF
# attack of FLTrust, Cao et al., 2021) and send that update unchanged: an honest norm, the wrong
# direction. Does the norm (safeguard) see it, does FLTrust's direction? Each attacked variant is
# compared to the same defense without attacker, seed by seed.
#   uv run python launch/campaign/strategy_campaign.py launch/campaign/cifar10_label_flip.yml
# Dirichlet 0.5 shares, 7 clients, 3 local epochs, 5 rounds, 100 trusted examples for FLTrust.
# 36 runs, about 40 minutes; do not run it next to a live session.
# Status: our own measurement, not a reproduction (docs/robust-aggregation.md, Limits).

server_config: configs/cifar10_cnn/distributed/without_ssl/server.yml
client_config: configs/cifar10_cnn/distributed/without_ssl/client_1.yml
output: experiments/campaigns
plugin_manifests: [launch/campaign/test-plugins-conf.yml]

clients: 7
rounds: 5
local_epochs: 3
port: 3399                 # the Flower server of each run: must be free
threads_per_client: auto   # physical cores / clients
timeout: 1800              # seconds per run
seeds: [1, 2, 3]           # every variant once per seed, then mean ± std

client_data:
  train:
    partition:
      scheme: dirichlet
      alpha: 0.5
      seed: 42
  val:
    source: holdout
    fraction: 0.1

server_data:
  test:
    max_samples: 2000
  trusted:
    max_samples: 100

variants:
  - label: FedAvg, no attacker
    strategy: {name: fedavg, config: {}}
  - label: FedAvg, 2 label flippers
    reference: FedAvg, no attacker
    strategy: {name: fedavg, config: {}}
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
  - label: FedMedian, no attacker
    strategy: {name: fedmedian, config: {}}
  - label: FedMedian, 2 label flippers
    reference: FedMedian, no attacker
    strategy: {name: fedmedian, config: {}}
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
  - label: Krum f 1, no attacker
    strategy: {name: krum, config: {num_malicious_clients: 1}}
  - label: Krum f 1, 2 label flippers
    reference: Krum f 1, no attacker
    strategy: {name: krum, config: {num_malicious_clients: 1}}
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
  - label: Bulyan f 1, no attacker
    strategy: {name: bulyan, config: {num_malicious_clients: 1}}
  - label: Bulyan f 1, 2 label flippers
    reference: Bulyan f 1, no attacker
    strategy: {name: bulyan, config: {num_malicious_clients: 1}}
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
  - label: safeguard, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7}}]
  - label: safeguard, 2 label flippers
    reference: safeguard, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
  - label: FLTrust, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: fltrust, config: {}}]
  - label: FLTrust, 2 label flippers
    reference: FLTrust, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: fltrust, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: label_flip}}}}
