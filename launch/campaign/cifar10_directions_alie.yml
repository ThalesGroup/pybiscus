# Campaign of launch/campaign/strategy_campaign.py: what tells discreet attackers apart when their
# norm does not (ALIE at z 2 stays within the honest clients' range, cifar10_clipping_reject_alie.yml)?
# The clipping defense logs each client's cosine similarity to the coordinate-wise median update and
# to its closest other client (log_directions: "🧭" lines of the server log), on dirichlet shares,
# without attacker, against 2 ALIE colluders of 7 (z 1, 2, 4) and against 2 sign flippers.
#   uv run python launch/campaign/strategy_campaign.py launch/campaign/cifar10_directions_alie.yml
# 10 runs, about 13 minutes; do not run it next to a live session.

server_config: configs/cifar10_cnn/distributed/without_ssl/server.yml
client_config: configs/cifar10_cnn/distributed/without_ssl/client_1.yml
output: experiments/campaigns
plugin_manifests: [launch/campaign/test-plugins-conf.yml]

clients: 7
rounds: 5
local_epochs: 3
port: 3399                 # the Flower server of each run: must be free
threads_per_client: auto   # physical cores / clients
timeout: 1800              # seconds per run
seeds: [1, 2]              # every variant once per seed, then mean ± std

client_data:
  train:
    partition:
      scheme: dirichlet
      alpha: 0.5
      seed: 42
  val:
    source: holdout
    fraction: 0.1

server_data:
  test:
    max_samples: 2000

variants:
  - label: no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, log_directions: true}}]
  - label: ALIE z 1.0
    reference: no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, log_directions: true}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 1.0, shared_dir: "{work}/alie"}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 1.0, shared_dir: "{work}/alie"}}}}
  - label: ALIE z 2.0
    reference: no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, log_directions: true}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 2.0, shared_dir: "{work}/alie"}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 2.0, shared_dir: "{work}/alie"}}}}
  - label: ALIE z 4.0
    reference: no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, log_directions: true}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 4.0, shared_dir: "{work}/alie"}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: alie, colluders: 2, num_clients: 7, z: 4.0, shared_dir: "{work}/alie"}}}}
  - label: sign flip x10
    reference: no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, log_directions: true}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
