# Campaign of launch/campaign/strategy_campaign.py: the defenses against the worst case of ALIE
# ("A Little Is Enough", Baruch et al., 2019). The 2 attackers know the honest updates of the round:
# the omniscientalie decorator (test manifest only), outside the defenses, replaces the updates of
# the clients flagged byzantine (byzantine client plugin, attack none: they train honestly) by
# mean - z * std of the honest ones. The client-side ALIE, where the colluders estimate them from
# their own 2 updates, did no measurable harm (cifar10_alie_dirichlet.yml): does the omniscient one,
# at the paper's z (0.57 for 2 of 7) and at z 2? Each variant is compared to the same defense
# without attacker (reference), seed by seed.
#   uv run python launch/campaign/strategy_campaign.py launch/campaign/cifar10_alie_omniscient.yml
# Dirichlet 0.5 shares, 3 local epochs, 5 rounds. 54 runs, about 55 minutes; do not run it next to
# a live session.
# Status: a worst-case variant of the paper's attack, whose attackers do not know the honest
# updates (docs/robust-aggregation.md, Limits of these measurements).

server_config: configs/cifar10_cnn/distributed/without_ssl/server.yml
client_config: configs/cifar10_cnn/distributed/without_ssl/client_1.yml
output: experiments/campaigns
plugin_manifests: [launch/campaign/test-plugins-conf.yml]

clients: 7
rounds: 5
local_epochs: 3
port: 3399                 # the Flower server of each run: must be free
threads_per_client: auto   # physical cores / clients
timeout: 1800              # seconds per run
seeds: [1, 2, 3]           # every variant once per seed, then mean ± std

client_data:
  train:
    partition:
      scheme: dirichlet
      alpha: 0.5
      seed: 42
  val:
    source: holdout
    fraction: 0.1

server_data:
  test:
    max_samples: 2000

variants:
  - label: FedAvg, no attacker
    strategy: {name: fedavg, config: {}}
  - label: FedAvg, omniscient ALIE paper z
    reference: FedAvg, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: FedAvg, omniscient ALIE z 2
    reference: FedAvg, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: FedMedian, no attacker
    strategy: {name: fedmedian, config: {}}
  - label: FedMedian, omniscient ALIE paper z
    reference: FedMedian, no attacker
    strategy: {name: fedmedian, config: {}}
    pipeline: [{name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: FedMedian, omniscient ALIE z 2
    reference: FedMedian, no attacker
    strategy: {name: fedmedian, config: {}}
    pipeline: [{name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: FedTrimmedAvg beta 0.2, no attacker
    strategy: {name: fedtrimmedavg, config: {beta: 0.2}}
  - label: FedTrimmedAvg beta 0.2, omniscient ALIE paper z
    reference: FedTrimmedAvg beta 0.2, no attacker
    strategy: {name: fedtrimmedavg, config: {beta: 0.2}}
    pipeline: [{name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: FedTrimmedAvg beta 0.2, omniscient ALIE z 2
    reference: FedTrimmedAvg beta 0.2, no attacker
    strategy: {name: fedtrimmedavg, config: {beta: 0.2}}
    pipeline: [{name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: Krum f 1, no attacker
    strategy: {name: krum, config: {num_malicious_clients: 1}}
  - label: Krum f 1, omniscient ALIE paper z
    reference: Krum f 1, no attacker
    strategy: {name: krum, config: {num_malicious_clients: 1}}
    pipeline: [{name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: Krum f 1, omniscient ALIE z 2
    reference: Krum f 1, no attacker
    strategy: {name: krum, config: {num_malicious_clients: 1}}
    pipeline: [{name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: Bulyan f 1, no attacker
    strategy: {name: bulyan, config: {num_malicious_clients: 1}}
  - label: Bulyan f 1, omniscient ALIE paper z
    reference: Bulyan f 1, no attacker
    strategy: {name: bulyan, config: {num_malicious_clients: 1}}
    pipeline: [{name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: Bulyan f 1, omniscient ALIE z 2
    reference: Bulyan f 1, no attacker
    strategy: {name: bulyan, config: {num_malicious_clients: 1}}
    pipeline: [{name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: clipping x1.5 reject x1.7, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, size_scaling: none}}]
  - label: clipping x1.5 reject x1.7, omniscient ALIE paper z
    reference: clipping x1.5 reject x1.7, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, size_scaling: none}}, {name: omniscientalie, config: {}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
  - label: clipping x1.5 reject x1.7, omniscient ALIE z 2
    reference: clipping x1.5 reject x1.7, no attacker
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 1.7, size_scaling: none}}, {name: omniscientalie, config: {z: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: none}}}}
