# Campaign of launch/campaign/strategy_campaign.py: FedAvg with each update's norm bounded to C
# (the clipping decorator; serverdpfixed / serverdpadaptive with noise_multiplier 0 for the
# earlier variants), on the heterogeneous shares of
# cifar10_robust_dirichlet.yml, against the same attacker. C around the size of an honest update
# (the log's dp_clipped_fraction shows how many clients get clipped).
#   uv run python launch/campaign/strategy_campaign.py launch/campaign/cifar10_clipping_dirichlet.yml
# Attacker: the byzantine client plugin (test manifest only), sign flip x10 of its update.
# About 20 minutes for all variants (--only to run some); do not run it next to a live session.

server_config: configs/cifar10_cnn/distributed/without_ssl/server.yml
client_config: configs/cifar10_cnn/distributed/without_ssl/client_1.yml
output: experiments/campaigns
plugin_manifests: [launch/campaign/test-plugins-conf.yml]

clients: 7
rounds: 5
local_epochs: 3
port: 3399                 # the Flower server of each run: must be free
threads_per_client: auto   # physical cores / clients
timeout: 1800              # seconds per run

client_data:
  train:
    partition:
      scheme: dirichlet
      alpha: 0.5
      seed: 42
  val:
    source: holdout
    fraction: 0.1

server_data:
  test:
    max_samples: 2000

variants:
  - label: FedAvg + clipping C 0.5, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 0.5}}]
  - label: FedAvg + clipping C 0.5, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 0.5}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping C 1.0, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 1.0}}]
  - label: FedAvg + clipping C 1.0, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 1.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping C 2.0, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 2.0}}]
  - label: FedAvg + clipping C 2.0, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + adaptive clipping (median), no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpadaptive, config: {noise_multiplier: 0.0, initial_clipping_norm: 1.0, target_clipped_quantile: 0.5}}]
  - label: FedAvg + adaptive clipping (median), 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: serverdpadaptive, config: {noise_multiplier: 0.0, initial_clipping_norm: 1.0, target_clipped_quantile: 0.5}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x1.5, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5}}]
  - label: FedAvg + clipping median x1.5, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x1.5, 2 attackers
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x2.0, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 2.0}}]
  - label: FedAvg + clipping median x2.0, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x2.0, 2 attackers
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 2.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x1.5 reject x3, no attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 3.0}}]
  - label: FedAvg + clipping median x1.5 reject x3, 1 attacker
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 3.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
  - label: FedAvg + clipping median x1.5 reject x3, 2 attackers
    strategy: {name: fedavggeneric, config: {}}
    pipeline: [{name: clipping, config: {mode: median, median_factor: 1.5, reject_factor: 3.0}}]
    client_overrides:
      0: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
      1: {flower_client: {alternate_client_class: {name: byzantine, config: {attack: sign_flip, scale: 10.0}}}}
