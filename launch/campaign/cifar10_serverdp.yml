# Campaign of launch/campaign/strategy_campaign.py: central differential privacy (server-side
# clipping + Gaussian noise) against FedAvg on cifar10.
#   uv run python launch/campaign/strategy_campaign.py launch/campaign/cifar10_serverdp.yml
# With 3 clients the noise's standard deviation z * C / 3 soon exceeds the weights of the CNN
# (about 0.05): only a small z keeps learning, and its epsilon is huge. Meaningful central DP needs
# many clients; the campaign shows the utility side of the trade-off. A variant's pipeline is put
# before the base server's decorators.
# About 1 minute per variant on a 14-core machine; do not run it next to a live session.

server_config: configs/cifar10_cnn/distributed/without_ssl/server.yml
client_config: configs/cifar10_cnn/distributed/without_ssl/client_1.yml
output: experiments/campaigns

clients: 3
rounds: 5
port: 3399                 # the Flower server of each run: must be free
threads_per_client: auto   # physical cores / clients
timeout: 1800              # seconds per run

client_data:
  train:
    max_samples: 8000
    partition:
      scheme: iid
      seed: 42
  val:
    source: holdout
    fraction: 0.1

server_data:
  test:
    max_samples: 2000

variants:
  - label: FedAvg
    strategy: {name: fedavg, config: {}}
  - label: DP fixed z 0, C 100 (clipping and noise inactive)
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.0, clipping_norm: 100.0}}]
  - label: DP fixed z 0.01, C 1
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.01, clipping_norm: 1.0}}]
  - label: DP fixed z 0.1, C 1
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.1, clipping_norm: 1.0}}]
  - label: DP fixed z 1, C 1
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 1.0, clipping_norm: 1.0}}]
  - label: DP fixed z 0.1, C 0.3
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpfixed, config: {noise_multiplier: 0.1, clipping_norm: 0.3}}]
  - label: DP adaptive z 0.1
    strategy: {name: fedavg, config: {}}
    pipeline: [{name: serverdpadaptive, config: {noise_multiplier: 0.1}}]
