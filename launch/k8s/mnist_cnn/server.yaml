# Applied by run.sh, which replaces the @...@ placeholders and creates the ConfigMap
# pybiscus-mnist-configs from configs/mnist_cnn/distributed/.

# in the CLI mode, the Flower server does not authenticate its clients: only the pods of the clients
# reach its port (k3s enforces it; another cluster needs a network plugin applying NetworkPolicies)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flower-server-clients-only
spec:
  podSelector:
    matchLabels:
      pybiscus.role: flower-server
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          pybiscus.role: flower-client
    ports:
    - protocol: TCP
      port: 3333
---
apiVersion: v1
kind: Service
metadata:
  name: flower-server
spec:
  selector:
    pybiscus.role: flower-server
  ports:
  - port: 3333
    targetPort: 3333
---
# a Job and not a Deployment: the server stops after its last round, a Deployment would restart it
apiVersion: batch/v1
kind: Job
metadata:
  name: flower-server
  labels:
    app.kubernetes.io/part-of: pybiscus-mnist
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pybiscus-mnist
        pybiscus.role: flower-server
    spec:
      restartPolicy: Never
      containers:
      - name: server
        image: @IMAGE@
        imagePullPolicy: Never
        workingDir: /app
        # the image runs as root: the reports written to the host's experiments/ are given back to
        # the user who ran run.sh
        command: ["/usr/bin/tini", "-g", "-s", "--", "/bin/bash", "-c"]
        args:
        - |
          /app/bin/pybiscus_in_container server launch k8s-configs/server.yml \
            --server-listen-address 0.0.0.0:3333 --num-rounds @NUM_ROUNDS@
          code=$?
          # -h: experiments/current is a link, chown would follow it
          find /app/experiments -user 0 -exec chown -h @UID@:@GID@ {} +
          exit $code
        env:
        # the configurations' root_dir is ${oc.env:PWD}
        - name: PWD
          value: /app
        ports:
        - containerPort: 3333
        # the Service sends the clients to the server only once it listens
        readinessProbe:
          tcpSocket:
            port: 3333
          periodSeconds: 3
        volumeMounts:
        - name: configs
          mountPath: /app/k8s-configs
          readOnly: true
        - name: datasets
          mountPath: /app/datasets
        - name: experiments
          mountPath: /app/experiments
      volumes:
      - name: configs
        configMap:
          name: pybiscus-mnist-configs
      # one node: the directories of the repository; on several nodes, a PersistentVolumeClaim
      - name: datasets
        hostPath:
          path: @REPO@/datasets
          type: Directory
      - name: experiments
        hostPath:
          path: @REPO@/experiments
          type: DirectoryOrCreate
