<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pybiscus · participants</title>
  <style>
    :root {
      --bar-bg: #f3f4f6;
      --bar-fg: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #2563eb;
      --accent-fg: #ffffff;
      --stage-bg: #e5e7eb;
      --frame-bg: #ffffff;
      --up: #16a34a;
      --down: #dc2626;
      --unknown: #9ca3af;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bar-bg: #1f2430;
        --bar-fg: #e5e7eb;
        --muted: #9ca3af;
        --line: #374151;
        --accent: #3b82f6;
        --stage-bg: #111827;
        --frame-bg: #ffffff;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font: 13px/1.3 system-ui, sans-serif;
      background: var(--stage-bg);
      color: var(--bar-fg);
    }

    #bar {
      position: fixed;
      inset: 0 0 auto 0;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 10px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--line);
      box-sizing: border-box;
      z-index: 20;
    }
    #bar .title { font-weight: 600; white-space: nowrap; }
    #bar .sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--line); }
    #bar .push { flex: 1; }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }

    #chips { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
    .chip kbd { font: 10px ui-monospace, monospace; opacity: .6; margin-left: 4px; }

    .segmented { display: inline-flex; }
    .segmented button { border-radius: 0; margin-left: -1px; }
    .segmented button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
    .segmented button:last-child { border-radius: 0 5px 5px 0; }

    #count { min-width: 1.5em; text-align: center; font-weight: 600; }

    details { position: relative; }
    details summary { list-style: none; cursor: pointer; padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; }
    details summary::-webkit-details-marker { display: none; }
    details .panel {
      position: absolute;
      right: 0;
      top: 30px;
      display: grid;
      grid-template-columns: auto 8em;
      gap: 6px 8px;
      align-items: center;
      padding: 10px;
      background: var(--bar-bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
    }
    details .panel input { font: inherit; width: 100%; box-sizing: border-box; }
    details .panel .hint { grid-column: 1 / -1; color: var(--muted); font-size: 11px; max-width: 22em; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--unknown); margin-right: 5px; vertical-align: 1px; }
    .dot.up { background: var(--up); }
    .dot.down { background: var(--down); }

    #stage {
      position: fixed;
      inset: 36px 0 0 0;
    }

    .participant {
      position: absolute;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--frame-bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-sizing: border-box;
      transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease, opacity .18s ease;
    }
    .participant.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .participant.hidden-solo { opacity: 0; pointer-events: none; }
    #stage.dragging .participant { transition: none; }

    .participant header {
      flex: 0 0 26px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      background: var(--bar-bg);
      color: var(--bar-fg);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
    }
    .participant header .name { font-weight: 600; }
    .participant header .port { color: var(--muted); }
    .participant header .push { flex: 1; }
    .participant header button { padding: 0 5px; border-color: transparent; }
    .participant header button:hover { border-color: var(--line); }

    .participant .viewport { position: relative; flex: 1; overflow: hidden; }
    .participant iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: 0;
      transform-origin: 0 0;
      background: var(--frame-bg);
    }
    /* a miniature is a preview: a click selects it instead of acting inside the page */
    .participant .cover { position: absolute; inset: 0; display: none; cursor: zoom-in; }
    .participant.miniature .cover { display: block; }
    .participant.miniature .cover:hover { background: rgba(37, 99, 235, .08); }

    #side-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: col-resize;
      display: none;
      z-index: 5;
    }
    #side-handle::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 2px;
      width: 4px;
      height: 40px;
      margin-top: -20px;
      border-radius: 2px;
      background: var(--line);
    }
    #side-handle:hover::after, #stage.dragging #side-handle::after { background: var(--accent); }

    /* the iframes would swallow mousemove/mouseup during a drag */
    #drag-shield { position: fixed; inset: 0; z-index: 30; cursor: col-resize; display: none; }
    #stage.dragging ~ #drag-shield { display: block; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="title">Pybiscus</span>
    <div id="chips"></div>
    <span class="sep"></span>
    <div class="segmented" id="modes">
      <button data-mode="grid" title="Tous les participants à égalité (G)">▦ Grille</button>
      <button data-mode="focus" title="Un participant en grand, les autres en miniatures (F)">◧ Focus</button>
      <button data-mode="solo" title="Un seul participant, plein écran (S)">▣ Seul</button>
    </div>
    <span class="push"></span>
    <span>Clients</span>
    <button id="fewer" title="Retirer le dernier client">−</button>
    <span id="count"></span>
    <button id="more" title="Ajouter un client">+</button>
    <details id="settings">
      <summary title="Adresses des agents">⚙</summary>
      <div class="panel">
        <label for="host">Hôte</label><input id="host">
        <label for="server-port">Port serveur</label><input id="server-port" type="number" min="1" max="65535">
        <label for="client-port">Port client 1</label><input id="client-port" type="number" min="1" max="65535">
        <span class="hint">Les clients suivants prennent les ports consécutifs. Paramètres d'URL
          acceptés : ?clients=4&amp;host=localhost&amp;server=5000&amp;client=5001&amp;mode=focus&amp;focus=1</span>
      </div>
    </details>
  </div>

  <div id="stage"><div id="side-handle"></div></div>
  <div id="drag-shield"></div>

  <script>
    const MAX_CLIENTS = 9;
    const GAP = 6;
    const MIN_SIDE = 160;
    // miniatures render the page as if it were this wide, then shrink it: the agent form keeps
    // its desktop layout instead of collapsing into an unreadable narrow column
    const MINIATURE_VIRTUAL_WIDTH = 1100;
    const REGISTRATION_PATH = "/session/agent/registration";
    // never the registration page: its GET resets the agent's registration, and a probe landing
    // between registration and the waiting page made the latter fail (KeyError, error 500)
    const PROBE_PATH = "/run/status";
    const PROBE_PERIOD_MS = 4000;
    const STORE_KEY = "pybiscus-participants-v1";

    const DEFAULTS = { clients: 2, host: "localhost", serverPort: 5000, clientPort: 5001, mode: "grid", focus: 0, sideRatio: 0.24 };

    function loadState() {
      let stored = {};
      try { stored = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { /* defaults */ }
      const state = { ...DEFAULTS, ...stored };
      const q = new URLSearchParams(location.search);
      const int = (key, fallback) => (q.has(key) && !isNaN(parseInt(q.get(key), 10)) ? parseInt(q.get(key), 10) : fallback);
      state.clients = Math.min(MAX_CLIENTS, Math.max(1, int("clients", state.clients)));
      state.host = q.get("host") || state.host;
      state.serverPort = int("server", state.serverPort);
      state.clientPort = int("client", state.clientPort);
      if (["grid", "focus", "solo"].includes(q.get("mode"))) state.mode = q.get("mode");
      state.focus = Math.min(state.clients, Math.max(0, int("focus", state.focus)));
      return state;
    }
    const state = loadState();
    function saveState() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* not remembered */ }
    }

    const stage = document.getElementById("stage");
    const handle = document.getElementById("side-handle");
    const chips = document.getElementById("chips");
    const participants = [];

    const portOf = index => (index === 0 ? state.serverPort : state.clientPort + index - 1);
    const baseUrlOf = index => `http://${state.host}:${portOf(index)}`;
    const labelOf = index => (index === 0 ? "Serveur" : `Client ${index}`);

    function button(text, title, onClick) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.title = title;
      b.addEventListener("click", event => { event.stopPropagation(); onClick(); });
      return b;
    }

    function createParticipant(index) {
      const p = { index, alive: null };
      p.el = document.createElement("section");
      p.el.className = "participant";

      const header = document.createElement("header");
      p.dot = Object.assign(document.createElement("span"), { className: "dot" });
      p.name = Object.assign(document.createElement("span"), { className: "name" });
      p.port = Object.assign(document.createElement("span"), { className: "port" });
      p.focusButton = button("⤢", "", () => toggleFocus(p.index));
      header.append(p.dot, p.name, p.port, Object.assign(document.createElement("span"), { className: "push" }),
                    p.focusButton,
                    button("⟳", "Recharger", () => reload(p)),
                    button("↗", "Ouvrir dans un nouvel onglet", () => window.open(baseUrlOf(p.index) + REGISTRATION_PATH, "_blank")));
      header.addEventListener("click", () => focusOn(p.index));

      const viewport = Object.assign(document.createElement("div"), { className: "viewport" });
      p.iframe = document.createElement("iframe");
      p.iframe.src = baseUrlOf(index) + REGISTRATION_PATH;
      const cover = Object.assign(document.createElement("div"), { className: "cover", title: "Afficher en grand" });
      cover.addEventListener("click", () => focusOn(p.index));
      viewport.append(p.iframe, cover);
      p.el.append(header, viewport);
      p.viewport = viewport;

      p.chip = button("", "", () => focusOn(p.index));
      p.chip.className = "chip";
      p.chipDot = Object.assign(document.createElement("span"), { className: "dot" });
      p.chip.append(p.chipDot, document.createTextNode(index === 0 ? "Serveur" : `C${index}`),
                    Object.assign(document.createElement("kbd"), { textContent: index }));

      refreshLabels(p);
      stage.append(p.el);
      chips.append(p.chip);
      return p;
    }

    function refreshLabels(p) {
      p.name.textContent = labelOf(p.index);
      p.port.textContent = `:${portOf(p.index)}`;
      p.chip.title = `${labelOf(p.index)} — ${baseUrlOf(p.index)}`;
    }

    function reload(p) {
      p.iframe.src = baseUrlOf(p.index) + REGISTRATION_PATH;
    }

    // iframes are only ever appended or removed at the end, never moved in the DOM: moving an
    // iframe reloads it and would lose the form being edited; the layout only changes positions
    function syncParticipants() {
      while (participants.length < state.clients + 1) participants.push(createParticipant(participants.length));
      while (participants.length > state.clients + 1) {
        const p = participants.pop();
        p.el.remove();
        p.chip.remove();
      }
      if (state.focus > state.clients) state.focus = 0;
      document.getElementById("count").textContent = state.clients;
      document.getElementById("fewer").disabled = state.clients <= 1;
      document.getElementById("more").disabled = state.clients >= MAX_CLIENTS;
    }

    function place(p, rect, scale) {
      Object.assign(p.el.style, { left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px" });
      // the header height is fixed by CSS; the rest is the page's viewport
      const innerW = rect.w - 2, innerH = rect.h - 2 - 26;
      Object.assign(p.iframe.style, {
        width: Math.max(0, innerW / scale) + "px",
        height: Math.max(0, innerH / scale) + "px",
        transform: scale === 1 ? "" : `scale(${scale})`,
      });
    }

    function gridColumns(n) {
      if (n <= 3) return n;
      if (n === 4) return 2;
      return Math.ceil(Math.sqrt(n));
    }

    function layout() {
      const W = stage.clientWidth, H = stage.clientHeight;
      const n = participants.length;
      const mode = n === 1 ? "solo" : state.mode;
      handle.style.display = mode === "focus" ? "block" : "none";

      participants.forEach(p => {
        const focused = p.index === state.focus;
        p.el.classList.toggle("focused", focused && mode !== "grid");
        p.el.classList.toggle("miniature", mode === "focus" && !focused);
        p.el.classList.toggle("hidden-solo", mode === "solo" && !focused);
        p.chip.classList.toggle("active", focused && mode !== "grid");
        p.focusButton.textContent = focused && mode !== "grid" ? "▦" : "⤢";
        p.focusButton.title = focused && mode !== "grid" ? "Revenir à la grille" : "Afficher en grand";
      });

      if (mode === "grid") {
        const cols = gridColumns(n), rows = Math.ceil(n / cols);
        const cw = (W - GAP * (cols + 1)) / cols, rh = (H - GAP * (rows + 1)) / rows;
        participants.forEach((p, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          place(p, { x: GAP + c * (cw + GAP), y: GAP + r * (rh + GAP), w: cw, h: rh }, 1);
        });
      } else if (mode === "focus") {
        const side = Math.min(W * 0.6, Math.max(MIN_SIDE, W * state.sideRatio));
        const mainW = W - side - GAP * 3;
        const others = participants.filter(p => p.index !== state.focus);
        const rh = (H - GAP * (others.length + 1)) / others.length;
        const sideW = side;
        const scale = Math.min(1, sideW / MINIATURE_VIRTUAL_WIDTH);
        place(participants[state.focus], { x: GAP, y: GAP, w: mainW, h: H - 2 * GAP }, 1);
        others.forEach((p, i) => place(p, { x: GAP * 2 + mainW, y: GAP + i * (rh + GAP), w: sideW, h: rh }, scale));
        handle.style.left = (GAP + mainW + (GAP - 8) / 2) + "px";
      } else {
        // hidden participants keep the focused one's size: no reflow of their page on return
        participants.forEach(p => place(p, { x: GAP, y: GAP, w: W - 2 * GAP, h: H - 2 * GAP }, 1));
      }

      document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    }

    function render() {
      syncParticipants();
      layout();
      saveState();
    }

    function setMode(mode) {
      state.mode = mode;
      render();
    }

    function focusOn(index) {
      if (index > state.clients) return;
      state.focus = index;
      if (state.mode === "grid") state.mode = "focus";
      render();
    }

    function toggleFocus(index) {
      if (state.mode !== "grid" && state.focus === index) {
        setMode("grid");
      } else {
        focusOn(index);
      }
    }

    // --- liveness: an opaque no-cors request resolves when the agent answers, rejects when
    // the port is closed (the agents send no CORS headers, so the response itself is unreadable)
    async function probe(p) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2000);
      let alive;
      try {
        await fetch(baseUrlOf(p.index) + PROBE_PATH, { mode: "no-cors", cache: "no-store", signal: controller.signal });
        alive = true;
      } catch (e) {
        alive = false;
      } finally {
        clearTimeout(timer);
      }
      // an agent restarted (debug reload, relaunch) leaves its frame on an error page: reload it
      if (alive && p.alive === false) reload(p);
      p.alive = alive;
      for (const dot of [p.dot, p.chipDot]) {
        dot.classList.toggle("up", alive);
        dot.classList.toggle("down", !alive);
      }
      const status = alive ? "joignable" : "injoignable";
      p.dot.title = p.chipDot.title = `${baseUrlOf(p.index)} ${status}`;
    }
    function probeAll() { participants.forEach(probe); }

    // --- controls
    document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
    document.getElementById("fewer").addEventListener("click", () => { state.clients = Math.max(1, state.clients - 1); render(); });
    document.getElementById("more").addEventListener("click", () => { state.clients = Math.min(MAX_CLIENTS, state.clients + 1); render(); probeAll(); });

    const hostInput = document.getElementById("host");
    const serverInput = document.getElementById("server-port");
    const clientInput = document.getElementById("client-port");
    hostInput.value = state.host;
    serverInput.value = state.serverPort;
    clientInput.value = state.clientPort;
    // applied on change (not on each keystroke): every change reloads the affected frames
    [hostInput, serverInput, clientInput].forEach(input => input.addEventListener("change", () => {
      const serverPort = parseInt(serverInput.value, 10), clientPort = parseInt(clientInput.value, 10);
      if (!hostInput.value.trim() || !(serverPort > 0) || !(clientPort > 0)) return;
      state.host = hostInput.value.trim();
      state.serverPort = serverPort;
      state.clientPort = clientPort;
      participants.forEach(p => { refreshLabels(p); reload(p); p.alive = null; });
      render();
      probeAll();
    }));

    document.addEventListener("keydown", event => {
      if (event.target.closest("input") || event.ctrlKey || event.metaKey || event.altKey) return;
      if (/^[0-9]$/.test(event.key)) focusOn(parseInt(event.key, 10));
      else if (event.key === "g" || event.key === "Escape") setMode("grid");
      else if (event.key === "f") setMode("focus");
      else if (event.key === "s") setMode("solo");
      else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        const n = participants.length;
        focusOn((state.focus + (event.key === "ArrowRight" ? 1 : n - 1)) % n);
      } else return;
      event.preventDefault();
    });

    handle.addEventListener("pointerdown", event => {
      event.preventDefault();
      stage.classList.add("dragging");
      const move = e => {
        const W = stage.clientWidth;
        state.sideRatio = Math.min(0.6, Math.max(MIN_SIDE / W, (W - e.clientX - GAP * 1.5) / W));
        layout();
      };
      const up = () => {
        stage.classList.remove("dragging");
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        saveState();
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    });
    handle.addEventListener("dblclick", () => { state.sideRatio = DEFAULTS.sideRatio; layout(); saveState(); });

    window.addEventListener("resize", layout);
    render();
    probeAll();
    setInterval(probeAll, PROBE_PERIOD_MS);
  </script>
</body>
</html>
