<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Disposition redimensionnable (3 colonnes)</title>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      display: flex;
    }

    .frame {
      flex: 1 1 0;
      min-width: 150px;
      border: 1px solid #000;
      box-sizing: border-box;
    }

    .divider {
      flex: 0 0 5px;
      background: #ccc;
      cursor: col-resize;
      transition: background 0.2s;
    }

    .divider:hover, .divider.dragging {
      background: #999;
    }

    /* pendant le drag, les iframes captureraient les événements souris :
       cet overlay passe au-dessus pour que mousemove/mouseup arrivent au document */
    .drag-shield {
      position: fixed;
      inset: 0;
      z-index: 10;
      cursor: col-resize;
      display: none;
    }

    .drag-shield.active {
      display: block;
    }
  </style>
</head>
<body>
  <iframe class="frame" src="http://localhost:5000/session/agent/registration"></iframe>
  <div class="divider"></div>
  <iframe class="frame" src="http://localhost:5001/session/agent/registration"></iframe>
  <div class="divider"></div>
  <iframe class="frame" src="http://localhost:5002/session/agent/registration"></iframe>

  <div class="drag-shield" id="drag-shield"></div>

  <script>
    const MIN_WIDTH = 150;

    const shield  = document.getElementById('drag-shield');
    const dividers = document.querySelectorAll('.divider');

    let dragged = null;   // le divider en cours de déplacement
    let before  = null;   // la frame à sa gauche
    let after   = null;   // la frame à sa droite
    let pairWidth = 0;    // largeur cumulée des deux, invariante pendant le drag

    dividers.forEach(divider => {
      divider.addEventListener('mousedown', event => {
        dragged = divider;
        before  = divider.previousElementSibling;
        after   = divider.nextElementSibling;

        // seules les deux frames adjacentes bougent ; les autres gardent leur largeur.
        // On fige donc tout le monde en pixels avant de commencer.
        document.querySelectorAll('.frame').forEach(frame => {
          frame.style.flex = `0 0 ${frame.offsetWidth}px`;
        });

        pairWidth = before.offsetWidth + after.offsetWidth;

        divider.classList.add('dragging');
        shield.classList.add('active');
        event.preventDefault();
      });
    });

    document.addEventListener('mousemove', event => {
      if (!dragged) return;

      const beforeWidth = event.clientX - before.getBoundingClientRect().left;
      const afterWidth  = pairWidth - beforeWidth;

      if (beforeWidth < MIN_WIDTH || afterWidth < MIN_WIDTH) return;

      before.style.flex = `0 0 ${beforeWidth}px`;
      after.style.flex  = `0 0 ${afterWidth}px`;
    });

    document.addEventListener('mouseup', () => {
      if (!dragged) return;

      dragged.classList.remove('dragging');
      shield.classList.remove('active');
      dragged = null;
    });

    // double-clic sur un séparateur : retour au partage équitable
    dividers.forEach(divider => {
      divider.addEventListener('dblclick', () => {
        document.querySelectorAll('.frame').forEach(frame => {
          frame.style.flex = '1 1 0';
        });
      });
    });
  </script>
</body>
</html>
